    function App() {
      const [departments, setDepartments] = useState(initialDepartmentsData);
      const [user, setUser] = useState(null);
      const [theme, setTheme] = useState('dark');
      const [language, setLanguage] = useState('ar');
      const [activeTab, setActiveTab] = useState('schedule');
      
      const [inputName, setInputName] = useState('');
      const [inputNid, setInputNid] = useState('');
      const [inputDept, setInputDept] = useState('تحكم صناعي');
      const [inputSection, setInputSection] = useState('1');

      const [selectedDayFilter, setSelectedDayFilter] = useState('all');
      const [searchQuery, setSearchQuery] = useState('');

      // حالة شيت الحضور والأنشطة
      const [lectureAttendance, setLectureAttendance] = useState({});
      const [sectionAttendance, setSectionAttendance] = useState({});

        'sheet_1': { title: 'Sheet 1 - Fundamentals', status: true, type: 'Sheet' },
        'task_1': { title: 'Task 1 - Practical Lab Report', status: false, type: 'Task' },
        'quiz_1': { title: 'Mid-Term Quiz 1', status: true, type: 'Quiz' }
      });

      // المحادثات والتنبيهات
      const [messages, setMessages] = useState([

      ]);
      const [newMessage, setNewMessage] = useState('');
      const [isPinnedMsg, setIsPinnedMsg] = useState(false);

      const [bannedUsers, setBannedUsers] = useState([]);
      const [banInput, setBanInput] = useState('');
      const [broadcasts, setBroadcasts] = useState([
        { id: 1, text: 'تنبيه هام من الكلية: الالتزام التام بالتسجيل في السكاشن والمناوبات المقررة.' }
      ]);
      const [broadcastInput, setBroadcastInput] = useState('');

      // التعديل والإضافة من قبل الأدمن
      const [editingItem, setEditingItem] = useState(null);
      const [addingDay, setAddingDay] = useState(null);

      const [editFormData, setEditFormData] = useState({
        subject: '',
        doc: '',
        place: '',
        time: '',
        type: 'lecture', // lecture OR section
        day: 'السبت'
      });

      const [isRecording, setIsRecording] = useState(false);
      const mediaRecorderRef = useRef(null);
      const audioChunksRef = useRef([]);

      useEffect(() => {
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      }, [theme]);

      const dict = dictionary[language] || dictionary.ar;
      const currentDeptData = departments[user ? user.department : inputDept];
      const deptTheme = currentDeptData.theme;

      const handleLogin = (e) => {
        e.preventDefault();
        if (!inputName.trim() || inputNid.length !== 14) {
          alert('برجاء إدخال الاسم الثلاثي والرقم القومي المكون من 14 رقماً بدقة!');
          return;
        }

        if (bannedUsers.includes(inputName.trim())) {
          alert(dict.bannedNotice);
          return;
        }

        const isAdmin = inputName.includes('شروق') || inputNid === '252';

        setUser({
          name: isAdmin ? 'شروق سمير السيد حميدو ٢٥٢' : inputName,
          department: inputDept,
          section: inputSection,
          isAdmin
        });
      };

      // عمليات الأدمن: إضافة وتعديل وحذف
      const openEditModal = (day, item, type) => {
        setEditingItem({ day, id: item.id, type });
        setEditFormData({
          subject: item.subject,
          doc: item.doc,
          place: item.place,
          time: item.time,
          type: type,
          day: day
        });
      };

      const openAddModal = (day) => {
        setAddingDay(day);
        setEditFormData({
          subject: '',
          doc: '',
          place: '',
          time: '09:00 - 10:00',
          type: 'lecture',
          day: day
        });
      };

      const handleSaveSlot = (e) => {
        e.preventDefault();
        const deptKey = user.department;
        const targetDay = editFormData.day;

        setDepartments(prev => {
          const updated = JSON.parse(JSON.stringify(prev));
          let dayObj = updated[deptKey].schedule[targetDay];
          if (typeof dayObj === 'string') {
            dayObj = { lectures: [], sections: [] };
            updated[deptKey].schedule[targetDay] = dayObj;
          }

          if (editingItem) {
            // حذف النسخة القديمة
            dayObj.lectures = dayObj.lectures.filter(l => l.id !== editingItem.id);
            dayObj.sections = dayObj.sections.filter(s => s.id !== editingItem.id);

            const newItem = {
              id: editingItem.id,
              subject: editFormData.subject,
              doc: editFormData.doc,
              place: editFormData.place,
              time: editFormData.time
            };

            if (editFormData.type === 'lecture') {
              dayObj.lectures.push(newItem);
            } else {
              dayObj.sections.push(newItem);
            }
          } else if (addingDay) {
            const newItem = {
              id: 'custom_' + Date.now(),
              subject: editFormData.subject,
              doc: editFormData.doc,
              place: editFormData.place,
              time: editFormData.time
            };

            if (editFormData.type === 'lecture') {
              dayObj.lectures.push(newItem);
            } else {
              dayObj.sections.push(newItem);
            }
          }

          return updated;
        });

        setEditingItem(null);
        setAddingDay(null);
      };

      const handleDeleteSlot = () => {
        if (!editingItem) return;
        const deptKey = user.department;
        const targetDay = editingItem.day;

        setDepartments(prev => {
          const updated = JSON.parse(JSON.stringify(prev));
          const dayObj = updated[deptKey].schedule[targetDay];
          if (dayObj && typeof dayObj !== 'string') {
            dayObj.lectures = dayObj.lectures.filter(l => l.id !== editingItem.id);
            dayObj.sections = dayObj.sections.filter(s => s.id !== editingItem.id);
          }
          return updated;
        });

        setEditingItem(null);
      };

      const startRecording = async () => {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          mediaRecorderRef.current = new MediaRecorder(stream);
          audioChunksRef.current = [];

          mediaRecorderRef.current.ondataavailable = (e) => {
            if (e.data.size > 0) audioChunksRef.current.push(e.data);
          };

          mediaRecorderRef.current.onstop = () => {
            const audioBlob = new Blob(audioChunksRef.current, { type: 'audio/webm' });
            const audioUrl = URL.createObjectURL(audioBlob);
            setMessages(prev => [...prev, {
              id: Date.now(),
              dept: user.department,
              user: user.name + ` (${dict.sec} ${user.section})`,
              text: audioUrl,
              isPinned: false,
              type: 'audio',
              time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            }]);
            stream.getTracks().forEach(track => track.stop());
          };

          mediaRecorderRef.current.start();
          setIsRecording(true);
        } catch (err) {
          alert('تعذر الوصول إلى الميكروفون.');
        }
      };

      const stopRecording = () => {
        if (mediaRecorderRef.current && isRecording) {
          mediaRecorderRef.current.stop();
          setIsRecording(false);
        }
      };

      const handleSendText = (e) => {
        e.preventDefault();
        if (!newMessage.trim()) return;

        setMessages(prev => [...prev, {
          id: Date.now(),
          dept: user.department,
          user: user.name + ` (${dict.sec} ${user.section})`,
          text: newMessage,
          isPinned: isPinnedMsg,
          type: 'text',
          time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        }]);

        setNewMessage('');
        setIsPinnedMsg(false);
      };

      if (!user) {
        return (

            <div className="w-full max-w-lg p-8 border rounded-3xl shadow-2xl bg-slate-900 border-slate-800 text-slate-100">
              
              <div className="flex justify-between items-center mb-6 pb-4 border-b border-slate-800">
                <div className="flex items-center gap-1.5 bg-slate-800 p-1 rounded-xl border border-slate-700">
                  <button onClick={() => setLanguage('ar')} className={`px-3 py-1 text-xs rounded-lg font-bold transition ${language === 'ar' ? 'bg-emerald-600 text-white shadow' : 'text-slate-400'}`}>عربي</button>
                  <button onClick={() => setLanguage('en')} className={`px-3 py-1 text-xs rounded-lg font-bold transition ${language === 'en' ? 'bg-emerald-600 text-white shadow' : 'text-slate-400'}`}>EN</button>
                  <button onClick={() => setLanguage('it')} className={`px-3 py-1 text-xs rounded-lg font-bold transition ${language === 'it' ? 'bg-emerald-600 text-white shadow' : 'text-slate-400'}`}>IT</button>
                </div>

                <button onClick={() => setTheme(theme === 'dark' ? 'light' : 'dark')} className="px-3.5 py-1.5 rounded-xl bg-slate-800 border border-slate-700 text-xs font-bold transition">
                  {theme === 'dark' ? '☀️ فاتح' : '🌙 داكن'}
                </button>
              </div>

              {/* شعار الكلية والجامعة بشكل أضخم وأجمل */}
              <div className="text-center mb-8">
                <div className="inline-flex items-center justify-center w-24 h-24 rounded-3xl bg-gradient-to-tr from-emerald-600 via-teal-500 to-indigo-600 text-white shadow-2xl mb-4 border-4 border-slate-800 transform hover:scale-105 transition-transform">

                </div>
                <h1 className="text-2xl font-black text-white">{dict.title}</h1>
                <p className="text-xs font-extrabold text-emerald-400 mt-1">{dict.subTitle}</p>
                <p className="text-[11px] text-slate-400 mt-1">العام الدراسي الرسمي 2026/2027 - الفصل الدراسي الأول</p>
              </div>

              <form onSubmit={handleLogin} className="space-y-4">

                  <label className="block text-xs font-bold mb-1.5">{dict.fullName}</label>
                  <input 
                    type="text" 
                    required
                    placeholder="الاسم الثلاثي..."
                    value={inputName}
                    onChange={(e) => setInputName(e.target.value)}
                    className="w-full px-4 py-3 border rounded-xl bg-slate-800 border-slate-700 text-white text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500"
                  />
                </div>

                <div>
                  <label className="block text-xs font-bold mb-1.5">{dict.nid}</label>
                  <input 
                    type="text" 
                    required
                    maxLength="14"
                    placeholder="14 رقماً..."
                    value={inputNid}
                    onChange={(e) => setInputNid(e.target.value)}
                    className="w-full px-4 py-3 border rounded-xl bg-slate-800 border-slate-700 text-white text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500"
                  />
                </div>

                <div>
                  <label className="block text-xs font-bold mb-1.5">{dict.dept}</label>
                  <select 
                    value={inputDept}
                    onChange={(e) => {
                      setInputDept(e.target.value);
                      setInputSection('1');
                    }}
                    className="w-full px-4 py-3 border rounded-xl bg-slate-800 border-slate-700 text-white text-sm focus:outline-none"
                  >
                    {Object.keys(departments).map((dept) => (
                      <option key={dept} value={dept}>{dept} {departments[dept].icon}</option>
                    ))}
                  </select>
                </div>

                <div>
                  <label className="block text-xs font-bold mb-1.5">{dict.sec}</label>
                  <select 
                    value={inputSection}
                    onChange={(e) => setInputSection(e.target.value)}
                    className="w-full px-4 py-3 border rounded-xl bg-slate-800 border-slate-700 text-white text-sm focus:outline-none"
                  >
                    {[...Array(currentDeptData.sectionsCount)].map((_, i) => (
                      <option key={i+1} value={i+1}>
                        {dict.sec} {i+1}
                      </option>
                    ))}
                  </select>
                </div>

                <button 
                  type="submit"
                  className="w-full bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-extrabold py-3.5 rounded-xl transition shadow-xl text-sm mt-4"
                >
                  {dict.enterBtn}
                </button>
              </form>
            </div>
          </div>
        );
      }

      return (
        <div className={`min-h-screen font-sans transition-colors duration-500 ${theme === 'dark' ? deptTheme.darkBg : deptTheme.lightBg}`} dir={language === 'en' ? 'ltr' : 'rtl'}>
          {/* Header العلوي الفخم */}
          <header className={`border-b sticky top-0 z-50 backdrop-blur-md ${theme === 'dark' ? 'bg-slate-900/95 border-slate-800' : 'bg-white/95 border-slate-200 shadow-md'}`}>
            <div className="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-4">
              
              <div className="flex items-center gap-3">
                <div className="w-12 h-12 rounded-2xl bg-gradient-to-tr from-emerald-600 via-teal-500 to-indigo-600 text-white flex items-center justify-center font-black text-lg shadow-lg border-2 border-slate-700">
                  HITU
                </div>
                <div>
                  <h1 className={`font-black text-base md:text-lg flex items-center gap-2 ${deptTheme.accent}`}>
                    <span>{currentDeptData.icon}</span> {user.name}
                  </h1>
                  <p className="text-xs font-extrabold opacity-80">
                    {language === 'en' ? currentDeptData.nameEn : language === 'it' ? currentDeptData.nameIt : user.department} — ({dict.sec} {user.section}) {user.isAdmin && '👑 (الأدمن)'}
                  </p>
                </div>
              </div>

              {/* الأزرار والتبويبات */}
              <div className="flex items-center gap-2 flex-wrap">
                <button onClick={() => setActiveTab('schedule')} className={`px-3.5 py-2 rounded-xl text-xs md:text-sm font-extrabold transition ${activeTab === 'schedule' ? 'bg-emerald-600 text-white shadow-lg' : theme === 'dark' ? 'bg-slate-800 text-slate-300' : 'bg-slate-200 text-slate-800'}`}>
                  {dict.scheduleTab}
                </button>

                <button onClick={() => setActiveTab('studentSheet')} className={`px-3.5 py-2 rounded-xl text-xs md:text-sm font-extrabold transition ${activeTab === 'studentSheet' ? 'bg-teal-600 text-white shadow-lg' : theme === 'dark' ? 'bg-slate-800 text-slate-300' : 'bg-slate-200 text-slate-800'}`}>
                  {dict.studentSheetTab}
                </button>

                <button onClick={() => setActiveTab('chat')} className={`px-3.5 py-2 rounded-xl text-xs md:text-sm font-extrabold transition ${activeTab === 'chat' ? 'bg-indigo-600 text-white shadow-lg' : theme === 'dark' ? 'bg-slate-800 text-slate-300' : 'bg-slate-200 text-slate-800'}`}>
                  {dict.chatTab}
                </button>

                <button onClick={() => setActiveTab('settings')} className={`px-3.5 py-2 rounded-xl text-xs md:text-sm font-extrabold transition ${activeTab === 'settings' ? 'bg-purple-600 text-white shadow-lg' : theme === 'dark' ? 'bg-slate-800 text-slate-300' : 'bg-slate-200 text-slate-800'}`}>
                  {dict.settingsTab}
                </button>

                {user.isAdmin && (
                  <button onClick={() => setActiveTab('admin')} className={`px-3.5 py-2 rounded-xl text-xs md:text-sm font-extrabold transition ${activeTab === 'admin' ? 'bg-amber-600 text-white shadow-lg animate-pulse' : 'bg-amber-500/20 text-amber-500 border border-amber-500/40'}`}>
                    {dict.adminTab}
                  </button>
                )}

                <button onClick={() => setUser(null)} className="text-xs px-3 py-2 rounded-xl bg-rose-600/20 text-rose-500 border border-rose-500/30 font-bold">
                  {dict.logout}
                </button>
              </div>
            </div>
          </header>

          <main className="max-w-7xl mx-auto px-4 py-6">
            
            {/* التنبيهات المباشرة */}
            {broadcasts.length > 0 && (
              <div className="mb-6 p-4 rounded-2xl bg-amber-500/10 border border-amber-500/30 text-amber-500 text-xs md:text-sm font-bold flex flex-col gap-1.5 shadow-lg backdrop-blur-md">
                <span className="flex items-center gap-2 font-black">📢 تنبيهات وإعلانات القسم الرسمية:</span>
                {broadcasts.map(b => (
                  <p key={b.id} className="font-semibold text-slate-200 dark:text-slate-300 opacity-90">• {b.text}</p>
                ))}
              </div>
            )}

            {/* TAB 1: الجدول الأكاديمي */}
            {activeTab === 'schedule' && (
              <div className="space-y-6">
                
                {/* شريط البحث وتصفية الأيام */}
                <div className={`p-5 rounded-2xl border shadow-xl backdrop-blur-md flex flex-wrap items-center justify-between gap-4 ${theme === 'dark' ? 'bg-slate-900/90 border-slate-800' : 'bg-white/90 border-slate-200'}`}>
                  <div>
                    <h2 className={`font-black text-xl flex items-center gap-2 ${deptTheme.accent}`}>
                      <span>{currentDeptData.icon}</span> {language === 'en' ? currentDeptData.nameEn : user.department}
                    </h2>
                    <p className="text-xs font-bold opacity-80 mt-1">{dict.sec}: ({user.section})</p>
                  </div>

                  <div className="flex items-center gap-3 flex-wrap w-full md:w-auto">
                    <div className="relative flex-1 md:w-72">
                      <input 
                        type="text"
                        placeholder={dict.searchPlaceholder}
                        value={searchQuery}
                        onChange={(e) => setSearchQuery(e.target.value)}
                        className={`w-full px-4 py-2.5 border rounded-xl text-xs md:text-sm font-medium focus:outline-none focus:ring-2 focus:ring-emerald-500 ${theme === 'dark' ? 'bg-slate-800 border-slate-700 text-white placeholder-slate-400' : 'bg-slate-50 border-slate-300 text-slate-900 placeholder-slate-500'}`}
                      />
                    </div>

                    <div className="flex items-center gap-2">
                      <span className="text-xs font-bold">{dict.selectDay}</span>
                      <select 
                        value={selectedDayFilter} 
                        onChange={(e) => setSelectedDayFilter(e.target.value)}
                        className={`px-4 py-2.5 border rounded-xl text-xs md:text-sm font-black ${deptTheme.accent} focus:outline-none ${theme === 'dark' ? 'bg-slate-800 border-slate-700' : 'bg-slate-50 border-slate-300'}`}
                      >
                        <option value="all">{dict.allDays}</option>
                        {Object.keys(currentDeptData.schedule).map(day => (
                          <option key={day} value={day}>{day}</option>
                        ))}
                      </select>
                    </div>
                  </div>
                </div>

                {/* عرض الأيام والجداول */}
                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                  {Object.entries(currentDeptData.schedule)
                    .filter(([day]) => selectedDayFilter === 'all' || day === selectedDayFilter)
                    .map(([day, dayContent]) => {
                      const isOffDay = typeof dayContent === 'string';

                      return (
                        <div key={day} className={`rounded-2xl border p-5 shadow-2xl backdrop-blur-md transition-all ${theme === 'dark' ? deptTheme.cardDark : deptTheme.cardLight}`}>
                          
                          <div className={`flex justify-between items-center mb-4 pb-3 border-b ${theme === 'dark' ? 'border-slate-800' : 'border-slate-200'}`}>
                            <h3 className={`font-black text-xl ${deptTheme.accent}`}>{day}</h3>
                            <div className="flex items-center gap-2">
                              {user.isAdmin && (
                                <button onClick={() => openAddModal(day)} className="px-2.5 py-1 text-[11px] rounded-lg font-bold bg-amber-600 text-white shadow hover:bg-amber-500">
                                  {dict.addNewSlotBtn}
                                </button>
                              )}
                              <span className={`text-xs px-2.5 py-1 rounded-lg font-bold ${theme === 'dark' ? 'bg-slate-800 text-slate-200' : 'bg-slate-100 text-slate-800'}`}>{dict.sec} {user.section}</span>
                            </div>
                          </div>

                          {isOffDay ? (
                            <div className={`py-12 text-center rounded-2xl border border-dashed ${theme === 'dark' ? 'bg-slate-950/60 border-slate-800' : 'bg-slate-50 border-slate-300'}`}>
                              <span className={`font-black text-base ${deptTheme.accent}`}>{dict.dayOff}</span>
                            </div>
                          ) : (
                            <div className="space-y-5">
                              
                              {/* المحاضرات النظرية Dr */}
                              <div>
                                <h4 className="text-xs font-black uppercase text-amber-500 mb-3 tracking-wider flex items-center justify-between">
                                  <span>{dict.lecturesHeader}</span>
                                </h4>
                                {dayContent.lectures && dayContent.lectures.length > 0 ? (
                                  <div className="space-y-3">
                                    {dayContent.lectures
                                      .filter(item => !searchQuery || item.subject.toLowerCase().includes(searchQuery.toLowerCase()) || item.doc.toLowerCase().includes(searchQuery.toLowerCase()))
                                      .map((item) => (
                                        <div key={item.id} className={`p-4 rounded-xl border transition shadow-md relative ${theme === 'dark' ? 'bg-slate-950/80 border-slate-800' : 'bg-slate-50 border-slate-200'}`}>
                                          {user.isAdmin && (
                                            <button onClick={() => openEditModal(day, item, 'lecture')} className="absolute top-3 left-3 text-[11px] px-2 py-0.5 rounded bg-amber-600 text-white font-bold">✏️ تعديل</button>
                                          )}
                                          <div className="flex justify-between items-start mb-1.5">
                                            <span className="text-[10px] px-2.5 py-0.5 rounded-md font-black bg-amber-500 text-slate-950">محاضرة Dr</span>
                                            <span className="text-xs font-extrabold opacity-80">⏰ {item.time}</span>
                                          </div>
                                          <h5 className="font-black text-xs md:text-sm leading-relaxed text-slate-100 dark:text-slate-100">{item.subject}</h5>
                                          <div className={`flex flex-col gap-1 text-[11px] font-bold opacity-90 mt-2.5 pt-2 border-t ${theme === 'dark' ? 'border-slate-800' : 'border-slate-200'}`}>
                                            <span>👨‍🏫 {dict.doc} {item.doc}</span>
                                            <span>📍 {dict.place} {item.place}</span>
                                          </div>
                                        </div>
                                      ))}
                                  </div>
                                ) : (
                                  <p className="text-xs opacity-50 italic">لا توجد محاضرات نظري في هذا اليوم.</p>
                                )}
                              </div>

                              {/* السكاشن والمعامل Eng */}
                              <div>
                                <h4 className="text-xs font-black uppercase text-indigo-400 mb-3 tracking-wider flex items-center justify-between">
                                  <span>{dict.sectionsHeader}</span>
                                </h4>
                                {dayContent.sections && dayContent.sections.length > 0 ? (
                                  <div className="space-y-3">
                                    {dayContent.sections
                                      .filter(item => !searchQuery || item.subject.toLowerCase().includes(searchQuery.toLowerCase()) || item.doc.toLowerCase().includes(searchQuery.toLowerCase()))
                                      .map((item) => (
                                        <div key={item.id} className={`p-4 rounded-xl border transition shadow-md relative ${theme === 'dark' ? 'bg-slate-950/80 border-slate-800' : 'bg-slate-50 border-slate-200'}`}>
                                          {user.isAdmin && (
                                            <button onClick={() => openEditModal(day, item, 'section')} className="absolute top-3 left-3 text-[11px] px-2 py-0.5 rounded bg-amber-600 text-white font-bold">✏️ تعديل</button>
                                          )}
                                          <div className="flex justify-between items-start mb-1.5">
                                            <span className="text-[10px] px-2.5 py-0.5 rounded-md font-black bg-indigo-600 text-white">سكشن Eng</span>
                                            <span className="text-xs font-extrabold opacity-80">⏰ {item.time}</span>
                                          </div>
                                          <h5 className="font-black text-xs md:text-sm leading-relaxed text-slate-100 dark:text-slate-100">{item.subject}</h5>
                                          <div className={`flex flex-col gap-1 text-[11px] font-bold opacity-90 mt-2.5 pt-2 border-t ${theme === 'dark' ? 'border-slate-800' : 'border-slate-200'}`}>
                                            <span>👨‍🏫 {dict.doc} {item.doc}</span>
                                            <span>📍 {dict.place} {item.place}</span>
                                          </div>
                                        </div>
                                      ))}
                                  </div>
                                ) : (
                                  <p className="text-xs opacity-50 italic">لا توجد سكاشن عملية في هذا اليوم.</p>
                                )}
                              </div>

                            </div>
                          )}
                        </div>
                      );
                    })}
                </div>
              </div>
            )}

            {/* TAB 2: شيت الحضور والتسليمات المطور */}
            {activeTab === 'studentSheet' && (
              <div className="space-y-6 max-w-4xl mx-auto">
                <div className={`p-6 rounded-2xl border shadow-2xl backdrop-blur-md ${theme === 'dark' ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200'}`}>
                  
                  <div className="flex justify-between items-center mb-6 pb-4 border-b border-slate-800">
                    <div>
                      <h2 className={`font-black text-xl ${deptTheme.accent}`}>📝 شيت متابعة الطالب والتسليمات الأسبوعية</h2>
                      <p className="text-xs font-bold text-slate-400 mt-1">الطالب: {user.name} | السكشن: ({user.section})</p>
                    </div>
                  </div>

                  {/* 1. حضور المحاضرات */}
                  <div className="space-y-4 mb-8">
                    <h3 className="text-sm font-black text-amber-500 uppercase tracking-wider">{dict.sheetLecturesHeader}</h3>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                      {Object.entries(currentDeptData.schedule).map(([day, content]) => {
                        if (typeof content === 'string' || !content.lectures) return null;
                        return content.lectures.map((lec) => {
                          const status = lectureAttendance[lec.id] || false;
                          return (
                            <div key={lec.id} className={`p-3.5 rounded-xl border flex justify-between items-center transition ${status ? 'bg-emerald-950/30 border-emerald-500/50' : 'bg-slate-950/60 border-slate-800'}`}>
                              <div>
                                <span className="text-[10px] font-bold text-slate-400">{day} | {lec.time}</span>
                                <h5 className="font-extrabold text-xs mt-0.5">{lec.subject}</h5>
                              </div>
                              <button 
                                onClick={() => setLectureAttendance(prev => ({ ...prev, [lec.id]: !prev[lec.id] }))}
                                className={`px-3 py-1.5 rounded-lg text-xs font-black shadow transition ${status ? 'bg-emerald-600 text-white' : 'bg-slate-800 text-slate-300'}`}
                              >
                                {status ? dict.attended : dict.absent}
                              </button>
                            </div>
                          );
                        });
                      })}
                    </div>
                  </div>

                  {/* 2. حضور السكاشن والمعامل */}
                  <div className="space-y-4 mb-8">
                    <h3 className="text-sm font-black text-indigo-400 uppercase tracking-wider">{dict.sheetSectionsHeader}</h3>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                      {Object.entries(currentDeptData.schedule).map(([day, content]) => {
                        if (typeof content === 'string' || !content.sections) return null;
                        return content.sections.map((sec) => {
                          const status = sectionAttendance[sec.id] || false;
                          return (
                            <div key={sec.id} className={`p-3.5 rounded-xl border flex justify-between items-center transition ${status ? 'bg-emerald-950/30 border-emerald-500/50' : 'bg-slate-950/60 border-slate-800'}`}>
                              <div>
                                <span className="text-[10px] font-bold text-slate-400">{day} | {sec.time}</span>
                                <h5 className="font-extrabold text-xs mt-0.5">{sec.subject}</h5>
                              </div>
                              <button 
                                onClick={() => setSectionAttendance(prev => ({ ...prev, [sec.id]: !prev[sec.id] }))}
                                className={`px-3 py-1.5 rounded-lg text-xs font-black shadow transition ${status ? 'bg-emerald-600 text-white' : 'bg-slate-800 text-slate-300'}`}
                              >
                                {status ? dict.attended : dict.absent}
                              </button>
                            </div>
                          );
                        });
                      })}
                    </div>
                  </div>

                  {/* 3. تسليم الشيتات والتاسكات والكويزات */}
                  <div className="space-y-4">
                    <h3 className="text-sm font-black text-teal-400 uppercase tracking-wider">{dict.sheetTasksHeader}</h3>
                    <div className="space-y-3">
                      {Object.entries(taskSubmissions).map(([key, task]) => (
                        <div key={key} className={`p-4 rounded-xl border flex justify-between items-center transition ${task.status ? 'bg-teal-950/30 border-teal-500/50' : 'bg-slate-950/60 border-slate-800'}`}>
                          <div>
                            <span className="text-[10px] px-2 py-0.5 rounded font-black bg-teal-600 text-white">{task.type}</span>
                            <h5 className="font-extrabold text-xs md:text-sm mt-1">{task.title}</h5>
                          </div>
                          <button 
                            onClick={() => setTaskSubmissions(prev => ({
                              ...prev,
                              [key]: { ...prev[key], status: !prev[key].status }
                            }))}
                            className={`px-4 py-1.5 rounded-lg text-xs font-black shadow transition ${task.status ? 'bg-teal-600 text-white' : 'bg-slate-800 text-slate-300'}`}
                          >
                            {task.status ? dict.submitted : dict.notSubmitted}
                          </button>
                        </div>
                      ))}
                    </div>
                  </div>

                </div>
              </div>
            )}

            {/* TAB 3: شات الدفعة والملاحظات */}
            {activeTab === 'chat' && (
              <div className={`max-w-3xl mx-auto rounded-2xl border shadow-2xl overflow-hidden flex flex-col h-[75vh] ${theme === 'dark' ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200'}`}>
                <div className={`p-4 text-white flex justify-between items-center shadow-lg ${deptTheme.badge}`}>
                  <h3 className="font-black text-sm md:text-base">{dict.chatTab}: {user.department} {currentDeptData.icon}</h3>
                </div>

                <div className="flex-1 p-4 overflow-y-auto space-y-3">
                  {messages.filter(m => m.dept === user.department).map((msg) => (
                    <div key={msg.id} className={`flex flex-col ${msg.user.includes(user.name) ? 'items-end' : 'items-start'}`}>
                      <div className="flex items-center gap-2 mb-1">
                        <span className="text-xs font-bold opacity-80">{msg.user}</span>
                        <span className="text-[10px] opacity-60">{msg.time}</span>
                        {msg.isPinned && (
                          <span className="bg-amber-500 text-slate-950 text-[10px] px-2 py-0.5 rounded font-black">
                            {dict.pinnedBadge}
                          </span>
                        )}
                      </div>
                      <div className={`p-3.5 rounded-2xl max-w-md text-sm font-medium ${msg.user.includes(user.name) ? 'bg-emerald-600 text-white rounded-tl-none `}>
                        {msg.type === 'audio' ? <audio controls src={msg.text} className="w-60 h-9"></audio> : msg.text}
                      </div>
                    </div>
                  ))}
                </div>

                <form onSubmit={handleSendText} className={`p-3 border-t flex flex-col gap-2 ${theme === 'dark' ? 'bg-slate-950 border-slate-800' : 'bg-slate-50 border-slate-300'}`}>
                  <div className="flex items-center justify-between">
                    <div className="flex items-center gap-2">
                      <input type="checkbox" id="pinMsg" checked={isPinnedMsg} onChange={(e) => setIsPinnedMsg(e.target.checked)} className="rounded text-emerald-600" />
                      <label htmlFor="pinMsg" className="text-xs font-bold opacity-80 cursor-pointer">{dict.pinMessage}</label>
                    </div>

                    {!isRecording ? (
                      <button type="button" onClick={startRecording} className="text-xs px-3 py-1.5 rounded-xl font-bold bg-indigo-600 text-white shadow hover:bg-indigo-700">{dict.recVoice}</button>
                    ) : (
                      <button type="button" onClick={stopRecording} className="text-xs px-3 py-1.5 rounded-xl font-bold bg-rose-600 text-white shadow animate-pulse">{dict.recStop}</button>
                    )}
                  </div>
                  <div className="flex gap-2">
                    <input type="text" placeholder="اكتب رسالتك..." value={newMessage} onChange={(e) => setNewMessage(e.target.value)} className={`flex-1 px-4 py-2.5 border rounded-xl text-sm font-medium focus:outline-none ${theme === 'dark' ? 'bg-slate-900 border-slate-700 text-white' : 'bg-white border-slate-300 text-slate-900'}`} />
                    <button type="submit" className="bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-2.5 rounded-xl shadow-lg font-bold text-sm">{dict.send}</button>
                  </div>
                </form>
              </div>
            )}

            {/* TAB 4: الإعدادات والسمات */}
            {activeTab === 'settings' && (
              <div className={`max-w-2xl mx-auto rounded-2xl border shadow-2xl p-6 space-y-6 ${theme === 'dark' ? 'bg-slate-900 border-slate-800 text-slate-100' : 'bg-white border-slate-200 text-slate-900'}`}>
                <h2 className="text-xl font-black pb-3 border-b border-slate-800">⚙️ الإعدادات العامة واللغة والسمات</h2>
                
                <div className="space-y-3">
                  <label className="block text-sm font-bold">اللغات المتاحة للترجمة الفورية:</label>
                  <div className="flex items-center gap-3">
                    <button onClick={() => setLanguage('ar')} className={`px-4 py-2 text-xs rounded-xl font-black transition ${language === 'ar' ? 'bg-emerald-600 text-white shadow-lg' : 'bg-slate-800'}`}>العربية 🇪🇬</button>
                    <button onClick={() => setLanguage('en')} className={`px-4 py-2 text-xs rounded-xl font-black transition ${language === 'en' ? 'bg-emerald-600 text-white shadow-lg' : 'bg-slate-800'}`}>English 🇬🇧</button>
                    <button onClick={() => setLanguage('it')} className={`px-4 py-2 text-xs rounded-xl font-black transition ${language === 'it' ? 'bg-emerald-600 text-white shadow-lg' : 'bg-slate-800'}`}>Italiano 🇮🇹</button>
                  </div>
                </div>

                <div className="space-y-3 pt-4 border-t border-slate-800">
                  <label className="block text-sm font-bold">نمط الواجهة (السمة):</label>
                  <button onClick={() => setTheme(theme === 'dark' ? 'light' : 'dark')} className="px-5 py-2.5 rounded-xl bg-slate-800 border border-slate-700 text-xs font-black transition shadow">
                    {theme === 'dark' ? '☀️ التحويل إلى الوضع الفاتح' : '🌙 التحويل إلى الوضع الداكن'}
                  </button>
                </div>
              </div>
            )}

            {/* TAB 5: لوحة الأدمن المخصصة لشروق */}
            {activeTab === 'admin' && user.isAdmin && (
              <div className="space-y-6 max-w-4xl mx-auto">
                <div className="p-5 rounded-2xl border bg-amber-500/10 border-amber-500/30 shadow-xl">
                  <h2 className="text-lg font-black text-amber-500">{dict.adminNotice}</h2>
                  <p className="text-xs font-bold text-slate-300 mt-1">مرحباً الأدمن شروق! يمكنك تعديل أو إضافة أي مادة وقاعة في أي وقت مباشرة في الجدول.</p>
                </div>

                <div className={`p-6 rounded-2xl border shadow-xl space-y-4 ${theme === 'dark' ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200'}`}>
                  <h3 className="font-black text-base text-rose-500">🚫 حظر وإدارة حسابات الطلاب</h3>
                  <div className="flex gap-2">
                    <input 
                      type="text"
                      placeholder="اسم الطالب المراد حظره..."
                      value={banInput}
                      onChange={(e) => setBanInput(e.target.value)}
                      className={`flex-1 px-4 py-2.5 border rounded-xl text-sm font-medium focus:outline-none ${theme === 'dark' ? 'bg-slate-800 border-slate-700 text-white' : 'bg-slate-50 border-slate-300 text-slate-900'}`}
                    />
                    <button onClick={() => { if(banInput) { setBannedUsers([...bannedUsers, banInput]); setBanInput(''); } }} className="bg-rose-600 hover:bg-rose-700 text-white px-5 py-2.5 rounded-xl text-xs font-black shadow">حظر الطالب</button>
                  </div>
                </div>

                <div className={`p-6 rounded-2xl border shadow-xl space-y-4 ${theme === 'dark' ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200'}`}>
                  <h3 className="font-black text-base text-amber-500">📢 لوحة نشر تنبيهات وإعلانات الدكاترة</h3>
                  <div className="flex gap-2">
                    <input 
                      type="text"
                      placeholder="اكتب التنبيه أو الإعلان الجديد..."
                      value={broadcastInput}
                      onChange={(e) => setBroadcastInput(e.target.value)}
                      className={`flex-1 px-4 py-2.5 border rounded-xl text-sm font-medium focus:outline-none ${theme === 'dark' ? 'bg-slate-800 border-slate-700 text-white' : 'bg-slate-50 border-slate-300 text-slate-900'}`}
                    />
                    <button onClick={() => { if(broadcastInput) { setBroadcasts([...broadcasts, { id: Date.now(), text: broadcastInput }]); setBroadcastInput(''); } }} className="bg-amber-600 hover:bg-amber-700 text-white px-5 py-2.5 rounded-xl text-xs font-black shadow">نشر التنبيه</button>
                  </div>
                </div>
              </div>
            )}

          </main>

          {/* نافذة التعديل والإضافة للجدول (Modal للأدمن) */}
          {(editingItem || addingDay) && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className={`w-full max-w-md p-6 rounded-3xl border shadow-2xl ${theme === 'dark' ? 'bg-slate-900 border-slate-800 text-white' : 'bg-white border-slate-200 text-slate-900'}`}>
                <h3 className="font-black text-lg mb-4 text-amber-500">
                  {editingItem ? dict.editModalTitle : dict.addModalTitle}
                </h3>
                
                <form onSubmit={handleSaveSlot} className="space-y-4">
                  <div>
                    <label className="block text-xs font-bold mb-1">{dict.subjectName}</label>
                    <input type="text" required value={editFormData.subject} onChange={(e) => setEditFormData({ ...editFormData, subject: e.target.value })} className={`w-full px-3 py-2 border rounded-xl text-xs font-bold ${theme === 'dark' ? 'bg-slate-800 border-slate-700' : 'bg-slate-50 border-slate-300'}`} />
                  </div>

                  <div>
                    <label className="block text-xs font-bold mb-1">{dict.instructorName}</label>
                    <input type="text" required value={editFormData.doc} onChange={(e) => setEditFormData({ ...editFormData, doc: e.target.value })} className={`w-full px-3 py-2 border rounded-xl text-xs font-bold ${theme === 'dark' ? 'bg-slate-800 border-slate-700' : 'bg-slate-50 border-slate-300'}`} />
                  </div>

                  <div>
                    <label className="block text-xs font-bold mb-1">{dict.locationName}</label>
                    <input type="text" required value={editFormData.place} onChange={(e) => setEditFormData({ ...editFormData, place: e.target.value })} className={`w-full px-3 py-2 border rounded-xl text-xs font-bold ${theme === 'dark' ? 'bg-slate-800 border-slate-700' : 'bg-slate-50 border-slate-300'}`} />
                  </div>

                  <div>
                    <label className="block text-xs font-bold mb-1">{dict.timeSlot}</label>
                    <input type="text" required value={editFormData.time} onChange={(e) => setEditFormData({ ...editFormData, time: e.target.value })} className={`w-full px-3 py-2 border rounded-xl text-xs font-bold ${theme === 'dark' ? 'bg-slate-800 border-slate-700' : 'bg-slate-50 border-slate-300'}`} />
                  </div>

                  <div>
                    <label className="block text-xs font-bold mb-1">{dict.sessionType}</label>
                    <select value={editFormData.type} onChange={(e) => setEditFormData({ ...editFormData, type: e.target.value })} className={`w-full px-3 py-2 border rounded-xl text-xs font-bold ${theme === 'dark' ? 'bg-slate-800 border-slate-700' : 'bg-slate-50 border-slate-300'}`}>
                      <option value="lecture">{dict.lectureType}</option>
                      <option value="section">{dict.sectionType}</option>
                    </select>
                  </div>

                  <div className="flex gap-2 pt-2">
                    <button type="submit" className="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white py-2.5 rounded-xl font-black text-xs shadow">{dict.saveBtn}</button>
                    {editingItem && (
                      <button type="button" onClick={handleDeleteSlot} className="bg-rose-600 hover:bg-rose-700 text-white px-4 py-2.5 rounded-xl font-black text-xs shadow">{dict.deleteBtn}</button>
                    )}
                    <button type="button" onClick={() => { setEditingItem(null); setAddingDay(null); }} className="bg-slate-700 text-slate-200 px-4 py-2.5 rounded-xl font-black text-xs">إلغاء</button>
                  </div>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
