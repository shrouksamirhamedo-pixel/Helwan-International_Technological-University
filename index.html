<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>جامعة حلوان الدولية التكنولوجية - المنصة الرسمية للجداول</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 font-sans transition-colors duration-300">
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    const departmentsData = {
      'تحكم صناعي': {
        nameAr: 'تحكم صناعي',
        nameEn: 'Industrial Control Technology',
        nameIt: 'Tecnologia di Controllo Industriale',
        theme: 'from-slate-900 via-emerald-950 to-slate-900 border-emerald-500/30 text-emerald-100',
        cardBg: 'bg-slate-900/80 border-emerald-500/20',
        badge: 'bg-emerald-600 text-white',
        schedule: {
          'السبت': [
            { time: '09:00 - 11:00', subject: 'دوائر كهربائية متقدمة (3Phase & Solid & Electronics)', place: 'مدرج C104 / D103' },
            { time: '11:00 - 01:00', subject: 'اللغة الإيطالية (د. وفاء عبد التواب)', place: 'مدرج A303' }
          ],
          'الأحد': [
            { time: '09:00 - 12:00', subject: 'هندسة التحكم والتشغيل الآلي والرسم الهندسي', place: 'مدرج G202 / G203' }
          ],
          'الإثنين': '🌴 ارتاح يابطل',
          'الثلاثاء': [
            { time: '09:00 - 11:00', subject: 'رياضيات هندسية متقدمة (د. إبراهيم عيد)', place: 'مدرج A303' }
          ],
          'الأربعاء': [
            { time: '09:00 - 02:00', subject: 'تطبيقات إلكترونية وورش عمل وتغذية', place: 'معمل F108 / الورش' }
          ],
          'الخميس': '🌴 ارتاح يابطل'
        }
      },
      'تكنولوجيا الملابس الجاهزة': {
        nameAr: 'تكنولوجيا الملابس الجاهزة',
        nameEn: 'Ready-Made Garments Technology',
        nameIt: 'Ready-Made Garments Technology',
        theme: 'from-slate-900 via-pink-950 to-slate-900 border-pink-500/30 text-pink-100',
        cardBg: 'bg-slate-900/80 border-pink-500/20',
        badge: 'bg-pink-600 text-white',
        schedule: {
          'الأحد': [
            { time: '09:00 - 01:00', subject: 'تشكيل على المانيكان وتكنولوجيا صناعة الملابس', place: 'مدرج C108 / G107' }
          ],
          'الإثنين': '🌴 ارتاح يابطل',
          'الثلاثاء': [
            { time: '09:00 - 02:00', subject: 'الموضة والازياء والثقافة والمجتمع (د. إيمان عبد المعطي)', place: 'مدرج C107 / C108' }
          ],
          'الأربعاء': [
            { time: '09:00 - 03:00', subject: 'تكنولوجيا المعلومات وأسس بناء الجسم', place: 'مدرج G203 / C104' }
          ],
          'الخميس': [
            { time: '09:00 - 02:00', subject: 'لغة إيطالية 1 وتطبيقات الملابس', place: 'مدرج G203' }
          ]
        }
      },
      'تكنولوجيا الأمن السيبراني': {
        nameAr: 'تكنولوجيا الأمن السيبراني',
        nameEn: 'Cyber-Security Technology',
        nameIt: 'Cyber-Security Technology',
        theme: 'from-slate-900 via-purple-950 to-slate-900 border-purple-500/30 text-purple-100',
        cardBg: 'bg-slate-900/80 border-purple-500/20',
        badge: 'bg-purple-600 text-white',
        schedule: {
          'الجمعة': [
            { time: '09:00 - 02:00', subject: 'أنظمة قواعد البيانات وأمن المعلومات (د. عبير حسن)', place: 'مدرج G202 / F-Seminar' }
          ],
          'السبت': [
            { time: '09:00 - 02:00', subject: 'الرياضيات وتكنولوجيا المعلومات (د. شيماء مهران)', place: 'مدرج A-NEW / D104' }
          ],
          'الأربعاء': [
            { time: '09:00 - 02:00', subject: 'الرياضيات والفيزياء التطبيقية', place: 'مدرج G204 / A202' }
          ],
          'الخميس': [
            { time: '09:00 - 03:00', subject: 'اللغة الإنجليزية وتأمين الأنظمة', place: 'مدرج A202 / F-Seminar' }
          ]
        }
      },
      'تكنولوجيا الميكاترونكس': {
        nameAr: 'تكنولوجيا الميكاترونكس',
        nameEn: 'Mechatronics Technology',
        nameIt: 'Mechatronics Technology',
        theme: 'from-slate-900 via-blue-950 to-slate-900 border-blue-500/30 text-blue-100',
        cardBg: 'bg-slate-900/80 border-blue-500/20',
        badge: 'bg-blue-600 text-white',
        schedule: {
          'الأحد': [
            { time: '09:00 - 03:00', subject: 'الفيزياء التطبيقية ومهارات الاتصال', place: 'مدرج G201 / A307' }
          ],
          'الإثنين': '🌴 ارتاح يابطل',
          'الثلاثاء': [
            { time: '09:00 - 03:00', subject: 'السلامة والصحة المهنية والرياضيات', place: 'مدرج G205 / G287' }
          ],
          'الأربعاء': [
            { time: '09:00 - 03:00', subject: 'الرياضيات المتقدمة وتطبيقات الفيزياء', place: 'مدرج G201 / A307' }
          ],
          'الخميس': [
            { time: '09:00 - 04:00', subject: 'رياضيات الفنيين ومهارات الاتصال', place: 'مدرج G282 / G205' }
          ]
        }
      },
      'تكنولوجيا الذكاء الاصطناعي': {
        nameAr: 'تكنولوجيا الذكاء الاصطناعي',
        nameEn: 'Artificial Intelligence Technology',
        nameIt: 'Artificial Intelligence Technology',
        theme: 'from-slate-900 via-indigo-950 to-slate-900 border-indigo-500/30 text-indigo-100',
        cardBg: 'bg-slate-900/80 border-indigo-500/20',
        badge: 'bg-indigo-600 text-white',
        schedule: {
          'الجمعة': [
            { time: '09:00 - 03:00', subject: 'بايثون والإحصاء التطبيقي (د. سيمون عزت)', place: 'مدرج A305 / G203' }
          ],
          'السبت': [
            { time: '09:00 - 03:00', subject: 'أنظمة الذكاء الاصطناعي والمعامل', place: 'مدرج A304 / D102' }
          ],
          'الأحد': [
            { time: '09:00 - 03:00', subject: 'الفيزياء والرياضيات المتقدمة', place: 'مدرج G107 / A303' }
          ]
        }
      },
      'تكنولوجيا الأوتوترونكس': {
        nameAr: 'تكنولوجيا الأوتوترونكس',
        nameEn: 'Autotronics Technology',
        nameIt: 'Autotronics Technology',
        theme: 'from-slate-900 via-amber-950 to-slate-900 border-amber-500/30 text-amber-100',
        cardBg: 'bg-slate-900/80 border-amber-500/20',
        badge: 'bg-amber-600 text-white',
        schedule: {
          'الأحد': [
            { time: '09:00 - 04:00', subject: 'أساسيات الورش والفيزياء والجرافيك للسيارات', place: 'مدرج AUTO-1A / D104' }
          ],
          'الإثنين': [
            { time: '09:00 - 04:00', subject: 'تكنولوجيا المعلومات والرسم الهندسي', place: 'مدرج A304 / G204' }
          ],
          'الثلاثاء': [
            { time: '09:00 - 04:00', subject: 'الرياضيات المتقدمة وتكنولوجيا المعلومات', place: 'مدرج AUTO-2A / D104' }
          ],
          'الأربعاء': [
            { time: '09:00 - 02:00', subject: 'اللغة الإنجليزية والرياضيات', place: 'مدرج A305 / AUTO-2A' }
          ]
        }
      },
      'تكنولوجيا علوم البيانات': {
        nameAr: 'تكنولوجيا علوم البيانات',
        nameEn: 'Data Science Technology',
        nameIt: 'Data Science Technology',
        theme: 'from-slate-900 via-teal-950 to-slate-900 border-teal-500/30 text-teal-100',
        cardBg: 'bg-slate-900/80 border-teal-500/20',
        badge: 'bg-teal-600 text-white',
        schedule: {
          'السبت': [
            { time: '09:00 - 03:00', subject: 'التحول الرقمي ونظم المعلومات والإحصاء', place: 'مدرج G204 / A305' }
          ],
          'الأحد': [
            { time: '09:00 - 02:00', subject: 'التحول الرقمي والفيزياء التطبيقية', place: 'مدرج G205' }
          ],
          'الإثنين': '🌴 ارتاح يابطل',
          'الثلاثاء': '🌴 ارتاح يابطل',
          'الأربعاء': '🌴 ارتاح يابطل',
          'الخميس': '🌴 ارتاح يابطل'
        }
      }
    };

    function App() {
      const [user, setUser] = useState(null);
      const [nameInput, setNameInput] = useState('');
      const [idInput, setIdInput] = useState('');
      const [groupNum, setGroupNum] = useState('5');
      const [deptInput, setDeptInput] = useState('تحكم صناعي');
      
      const [theme, setTheme] = useState('dark');
      const [language, setLanguage] = useState('ar');
      const [activeTab, setActiveTab] = useState('schedule');
      const [searchQuery, setSearchQuery] = useState('');

      const [chatMessages, setChatMessages] = useState([
        { id: 1, dept: 'تحكم صناعي', user: 'شروق سمير (٢٥٢ - أدمن)', text: 'أهلاً بجميع طلاب قسم تحكم صناعي، تم تحديث الجدول الرسمي بدقة.', time: '10:00 AM' }
      ]);
      const [newMsg, setNewMsg] = useState('');

      const handleLogin = (e) => {
        e.preventDefault();
        if(!nameInput.trim() || !idInput.trim()) {
          alert('يرجى إدخال الاسم الثلاثي والرقم القومي!');
          return;
        }
        setUser({
          name: nameInput,
          nationalId: idInput,
          group: groupNum,
          department: deptInput,
          isAdmin: nameInput.includes('شروق') || idInput === '252'
        });
      };

      const sendMessage = (e) => {
        e.preventDefault();
        if(!newMsg.trim()) return;
        setChatMessages([...chatMessages, {
          id: Date.now(),
          dept: user.department,
          user: user.name + ` (مجموعة ${user.group})`,
          text: newMsg,
          time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})
        }]);
        setNewMsg('');
      };

      const t = (ar, en, it) => {
        if(language === 'en') return en;
        if(language === 'it' && user?.department === 'تحكم صناعي') return it;
        return ar;
      };

      if(!user) {
        return (
          <div className="min-h-screen bg-slate-950 flex items-center justify-center p-4" dir="rtl">
            <div className="bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl max-w-md w-full p-8 text-slate-100">
              <div className="text-center mb-6">
                <div className="bg-emerald-600 text-white p-3 rounded-full inline-flex mb-2 shadow-lg font-bold text-xl">HTU</div>
                <h1 className="text-xl font-bold">جامعة حلوان الدولية التكنولوجية</h1>
                <p className="text-xs text-slate-400 mt-1">منصة الجداول الرسمية - إشراف: شروق سمير (٢٥٢)</p>
              </div>
              <form onSubmit={handleLogin} className="space-y-4">
                <div>
                  <label className="block text-xs font-semibold text-slate-300 mb-1">الاسم الثلاثي:</label>
                  <input type="text" required placeholder="اكتب اسمك الثلاثي..." value={nameInput} onChange={e => setNameInput(e.target.value)} className="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-xl text-sm focus:ring-2 focus:ring-emerald-500 text-white"/>
                </div>
                <div>
                  <label className="block text-xs font-semibold text-slate-300 mb-1">الرقم القومي:</label>
                  <input type="text" required placeholder="أدخل الرقم القومي..." value={idInput} onChange={e => setIdInput(e.target.value)} className="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-xl text-sm focus:ring-2 focus:ring-emerald-500 text-white"/>
                </div>
                <div>
                  <label className="block text-xs font-semibold text-slate-300 mb-1">رقم المجموعة (1 إلى 12):</label>
                  <select value={groupNum} onChange={e => setGroupNum(e.target.value)} className="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-xl text-sm text-white">
                    {[...Array(12)].map((_, i) => <option key={i+1} value={i+1}>مجموعة {i+1}</option>)}
                  </select>
                </div>
                <div>
                  <label className="block text-xs font-semibold text-slate-300 mb-1">اختر القسم الدراسي:</label>
                  <select value={deptInput} onChange={e => setDeptInput(e.target.value)} className="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-xl text-sm text-white">
                    {Object.keys(departmentsData).map(dept => <option key={dept} value={dept}>{dept}</option>)}
                  </select>
                </div>
                <button type="submit" className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl transition shadow text-sm">
                  {language === 'ar' ? 'دخول المنصة وعرض الجدول 🚀' : 'Enter Platform 🚀'}
                </button>
              </form>
            </div>
          </div>
        );
      }

      const deptInfo = departmentsData[user.department];

      return (
        <div className={`min-h-screen bg-gradient-to-br ${deptInfo.theme}`} dir="rtl">
          <header className="border-b border-white/10 sticky top-0 z-50 backdrop-blur-md bg-slate-950/80">
            <div className="max-w-7xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-4 text-white">
              <div>
                <h1 className="font-bold text-sm md:text-base">{user.name}</h1>
                <p className="text-xs text-emerald-400 font-semibold">{t(user.department, deptInfo.nameEn, deptInfo.nameIt)} — ({t('مجموعة', 'Group', 'Gruppo')} {user.group}) {user.isAdmin && '✨ (أدمن)'}</p>
              </div>
              <div className="flex items-center gap-2 flex-wrap">
                <div className="flex items-center gap-1 bg-slate-900/80 p-1 rounded-lg border border-white/10">
                  <button onClick={() => setLanguage('ar')} className={`px-2 py-1 text-xs rounded font-bold ${language === 'ar' ? 'bg-emerald-600 text-white' : 'text-slate-300'}`}>عربي</button>
                  <button onClick={() => setLanguage('en')} className={`px-2 py-1 text-xs rounded font-bold ${language === 'en' ? 'bg-emerald-600 text-white' : 'text-slate-300'}`}>EN</button>
                  {user.department === 'تحكم صناعي' && (
                    <button onClick={() => setLanguage('it')} className={`px-2 py-1 text-xs rounded font-bold ${language === 'it' ? 'bg-emerald-600 text-white' : 'text-slate-300'}`}>IT</button>
                  )}
                </div>
                <button onClick={() => setActiveTab('schedule')} className={`px-3 py-1.5 rounded-lg text-sm font-medium ${activeTab === 'schedule' ? 'bg-emerald-600 text-white' : 'bg-slate-900/80 text-slate-300'}`}>
                  {t('📅 الجدول الدراسي', '📅 Schedule', '📅 Orario')}
                </button>
                <button onClick={() => setActiveTab('chat')} className={`px-3 py-1.5 rounded-lg text-sm font-medium ${activeTab === 'chat' ? 'bg-emerald-600 text-white' : 'bg-slate-900/80 text-slate-300'}`}>
                  {t('💬 شات القسم', '💬 Dept Chat', '💬 Chat')}
                </button>
                <button onClick={() => setUser(null)} className="text-xs px-3 py-1.5 rounded-lg bg-rose-500/20 text-rose-300 font-semibold border border-rose-500/30">خروج</button>
              </div>
            </div>
          </header>

          <main className="max-w-7xl mx-auto px-4 py-6">
            {activeTab === 'schedule' && (
              <div className="space-y-6">
                <div className="p-4 rounded-2xl shadow-lg border border-white/10 bg-slate-900/70 backdrop-blur-md flex items-center gap-3">
                  <input type="text" placeholder={t('ابحث عن محاضرة، دكتور، مبنى، أو يوم...', 'Search lectures, doctor, building...', 'Cerca...')} value={searchQuery} onChange={e => setSearchQuery(e.target.value)} className="w-full bg-transparent focus:outline-none text-sm text-white placeholder-slate-400"/>
                </div>

                <div className={`p-5 rounded-2xl border ${deptInfo.cardBg} flex justify-between items-center backdrop-blur-md`}>
                  <div>
                    <h2 className="font-bold text-lg text-white">{t('جدول محاضرات:', 'Schedule for:', 'Orario per:')} {t(user.department, deptInfo.nameEn, deptInfo.nameIt)}</h2>
                    <p className="text-xs text-slate-300 mt-1">{t('مخصص لطلاب المجموعة رقم', 'Dedicated for Group', 'Dedicato al Gruppo')} ({user.group}) {t('من أصل 12 مجموعة', 'of 12 groups', 'di 12 gruppi')}</p>
                  </div>
                  <span className={`text-xs px-3 py-1.5 rounded-full font-bold shadow ${deptInfo.badge}`}>{t('معتمد رسمياً', 'Officially Approved', 'Approvato')}</span>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                  {Object.entries(deptInfo.schedule).map(([day, content]) => {
                    const isOff = content === '🌴 ارتاح يابطل';
                    return (
                      <div key={day} className={`rounded-2xl border p-5 shadow-xl backdrop-blur-md ${deptInfo.cardBg}`}>
                        <div className="flex justify-between items-center mb-4 pb-3 border-b border-white/10">
                          <h3 className="font-bold text-lg text-emerald-400">{day}</h3>
                          <span className="text-xs bg-white/10 text-white px-2.5 py-1 rounded-lg font-bold">{t('مجموعة', 'Group', 'Gruppo')} {user.group}</span>
                        </div>
                        {isOff ? (
                          <div className="py-10 text-center bg-white/5 rounded-xl border border-dashed border-white/10">
                            <span className="font-bold text-emerald-400">{t('🌴 ارتاح يابطل', '🌴 Day Off', '🌴 Riposo')}</span>
                          </div>
                        ) : (
                          <div className="space-y-3">
                            {content.map((item, idx) => (
                              <div key={idx} className="p-3.5 rounded-xl border border-white/10 bg-slate-950/50 hover:bg-slate-950/80 transition">
                                <span className="text-[10px] bg-emerald-600 text-white px-2 py-0.5 rounded-md font-bold">{item.time}</span>
                                <h4 className="font-bold text-sm mt-2 text-white">{item.subject}</h4>
                                <p className="text-xs text-slate-400 mt-1.5">📍 {t('المكان:', 'Place:', 'Luogo:')} {item.place}</p>
                              </div>
                            ))}
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {activeTab === 'chat' && (
              <div className="max-w-3xl mx-auto bg-slate-900/90 border border-white/10 rounded-2xl shadow-2xl overflow-hidden flex flex-col h-[75vh] backdrop-blur-md">
                <div className="p-4 bg-emerald-600 text-white flex justify-between items-center shadow">
                  <div>
                    <h3 className="font-bold">{t('شات قسم:', 'Department Chat:', 'Chat del Dipartimento:')} {t(user.department, deptInfo.nameEn, deptInfo.nameIt)}</h3>
                    <p className="text-xs text-emerald-200">{t('محادثة مغلقة ومخصصة لطلاب قسمك فقط', 'Private chat for your department students only', 'Chat privata')}</p>
                  </div>
                </div>
                <div className="flex-1 p-4 overflow-y-auto space-y-3">
                  {chatMessages.filter(m => m.dept === user.department).map(m => (
                    <div key={m.id} className={`flex flex-col ${m.user.includes(user.name) ? 'items-end' : 'items-start'}`}>
                      <span className="text-[10px] text-slate-400 mb-1">{m.user} ({m.time})</span>
                      <div className={`p-3 rounded-2xl max-w-md text-sm ${m.user.includes(user.name) ? 'bg-emerald-600 text-white' : 'bg-slate-800 text-slate-100 border border-slate-700'}`}>
                        {m.text}
                      </div>
                    </div>
                  ))}
                </div>
                <form onSubmit={sendMessage} className="p-3 border-t border-white/10 bg-slate-950 flex gap-2">
                  <input type="text" placeholder={t('اكتب رسالتك لزملاء القسم...', 'Type your message to department peers...', 'Scrivi un messaggio...')} value={newMsg} onChange={e => setNewMsg(e.target.value)} className="flex-1 px-4 py-2 border border-slate-700 rounded-xl bg-slate-900 text-sm focus:outline-none text-white"/>
                  <button type="submit" className="bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-2 rounded-xl shadow font-bold text-sm">{t('إرسال', 'Send', 'Invia')}</button>
                </form>
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
