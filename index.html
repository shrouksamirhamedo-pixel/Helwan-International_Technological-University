        fullName: 'Full Name:',
        nid: 'National ID (14 digits):',

        sec: 'Section / Group:',

    function App() {

      const [theme, setTheme] = useState('light');
      const [language, setLanguage] = useState('ar');
      const [activeTab, setActiveTab] = useState('schedule');
      
      const [inputName, setInputName] = useState('');
      const [inputNid, setInputNid] = useState('');
      const [inputDept, setInputDept] = useState('تحكم صناعي');
      const [inputSection, setInputSection] = useState('1');

      const [messages, setMessages] = useState([
        { id: 1, dept: 'تحكم صناعي', user: 'شروق سمير (الأدمن)', text: 'أهلاً بكم في المنصة الرسمية لجدول الكلية.', isPinned: true, type: 'text', time: '10:00 AM' }
      ]);
      const [newMessage, setNewMessage] = useState('');
      const [isPinnedMsg, setIsPinnedMsg] = useState(false);
      const [searchQuery, setSearchQuery] = useState('');
      
      // تسجيل الصوت الحقيقي
      const [isRecording, setIsRecording] = useState(false);
      const mediaRecorderRef = useRef(null);
      const audioChunksRef = useRef([]);

      useEffect(() => {
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      }, [theme]);

      const dict = dictionary[language] || dictionary.ar;
      const currentDeptData = departmentsData[user ? user.department : inputDept];

      const handleLogin = (e) => {
        e.preventDefault();
        if (!inputName.trim() || inputNid.length !== 14) {
          alert(language === 'en' ? 'Please enter a valid name and a 14-digit National ID.' : 'برجاء إدخال اسم صحيح والرقم القومي المكون من 14 رقماً!');
          return;
        }

        const isAdmin = inputName.includes('شروق') || inputNid === '252';

        setUser({
          name: isAdmin ? 'شروق سمير السيد حميدو ٢٥٢' : inputName,
          department: inputDept,
          section: inputSection,
          isAdmin
        });
      };

      const startRecording = async () => {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          mediaRecorderRef.current = new MediaRecorder(stream);
          audioChunksRef.current = [];

          mediaRecorderRef.current.ondataavailable = (e) => {
            if (e.data.size > 0) audioChunksRef.current.push(e.data);
          };

          mediaRecorderRef.current.onstop = () => {
            const audioBlob = new Blob(audioChunksRef.current, { type: 'audio/webm' });
            const audioUrl = URL.createObjectURL(audioBlob);
            setMessages(prev => [...prev, {
              id: Date.now(),
              dept: user.department,
              user: user.name + ` (${dict.section} ${user.section})`,
              text: audioUrl,
              isPinned: false,
              type: 'audio',
              time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            }]);
            stream.getTracks().forEach(track => track.stop());
          };

          mediaRecorderRef.current.start();
          setIsRecording(true);
        } catch (err) {
          alert('تعذر الوصول إلى الميكروفون / Microphone access error');
        }
      };

      const stopRecording = () => {
        if (mediaRecorderRef.current && isRecording) {
          mediaRecorderRef.current.stop();
          setIsRecording(false);
        }
      };

      const handleSendText = (e) => {
        e.preventDefault();
        if (!newMessage.trim()) return;

        setMessages(prev => [...prev, {
          id: Date.now(),
          dept: user.department,
          user: user.name + ` (${dict.section} ${user.section})`,
          text: newMessage,
          isPinned: isPinnedMsg,
          type: 'text',
          time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        }]);

        setNewMessage('');
        setIsPinnedMsg(false);
      };

      if (!user) {
        return (
          <div className="min-h-screen flex items-center justify-center p-4 font-sans text-right transition-colors bg-slate-100 dark:bg-slate-950 text-slate-800 dark:text-slate-100" dir={language === 'en' ? 'ltr' : 'rtl'}>
            <div className="w-full max-w-md p-8 border rounded-3xl shadow-2xl bg-white dark:bg-slate-900 border-slate-200 dark:border-slate-800">
              
              {/* أدوات التحكم باللغة والسمة على الشاشة الافتتاحية */}
              <div className="flex justify-between items-center mb-6 pb-4 border-b border-slate-200 dark:border-slate-800">
                <div className="flex items-center gap-1 bg-slate-100 dark:bg-slate-800 p-1 rounded-xl border border-slate-200 dark:border-slate-700">

                  <button onClick={() => setLanguage('en')} className={`px-2.5 py-1 text-xs rounded-lg font-bold transition ${language === 'en' ? 'bg-emerald-600 text-white' : 'text-slate-500 dark:text-slate-400'}`}>EN</button>
                  <button onClick={() => setLanguage('it')} className={`px-2.5 py-1 text-xs rounded-lg font-bold transition ${language === 'it' ? 'bg-emerald-600 text-white' : 'text-slate-500 dark:text-slate-400'}`}>IT</button>
                </div>

                <button onClick={() => setTheme(theme === 'dark' ? 'light' : 'dark')} className="px-3 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs font-bold transition">
                  {theme === 'dark' ? '☀️ فاتح' : '🌙 داكن'}
                </button>
              </div>

              <div className="text-center mb-6">
                <div className="bg-emerald-600 text-white w-14 h-14 rounded-full inline-flex items-center justify-center mb-3 shadow-lg font-bold text-xl">HTU</div>

                <p className="text-xs text-slate-500 dark:text-slate-400 mt-1">{dict.subTitle}</p>
              </div>

              <form onSubmit={handleLogin} className="space-y-4">

                  <input 
                    type="text" 
                    required
                    placeholder={dict.fullName}
                    value={inputName}
                    onChange={(e) => setInputName(e.target.value)}
                    className="w-full px-4 py-2.5 border rounded-xl bg-slate-50 dark:bg-slate-800 border-slate-300 dark:border-slate-700 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500"
                  />
                </div>

                <div>
                  <label className="block text-xs font-semibold mb-1">{dict.nid}</label>
                  <input 
                    type="text" 
                    required
                    maxLength="14"
                    placeholder="14 digits..."
                    value={inputNid}
                    onChange={(e) => setInputNid(e.target.value)}
                    className="w-full px-4 py-2.5 border rounded-xl bg-slate-50 dark:bg-slate-800 border-slate-300 dark:border-slate-700 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500"
                  />
                </div>

                <div>
                  <label className="block text-xs font-semibold mb-1">{dict.dept}</label>
                  <select 
                    value={inputDept}
                    onChange={(e) => {
                      setInputDept(e.target.value);
                      setInputSection('1');
                    }}
                    className="w-full px-4 py-2.5 border rounded-xl bg-slate-50 dark:bg-slate-800 border-slate-300 dark:border-slate-700 text-sm focus:outline-none"
                  >
                    {Object.keys(departmentsData).map((dept) => (
                      <option key={dept} value={dept}>{dept}</option>
                    ))}
                  </select>
                </div>

                <div>
                  <label className="block text-xs font-semibold mb-1">{dict.sec}</label>
                  <select 
                    value={inputSection}
                    onChange={(e) => setInputSection(e.target.value)}
                    className="w-full px-4 py-2.5 border rounded-xl bg-slate-50 dark:bg-slate-800 border-slate-300 dark:border-slate-700 text-sm focus:outline-none"
                  >
                    {[...Array(currentDeptData.sectionsCount)].map((_, i) => (
                      <option key={i+1} value={i+1}>
                        {dict.section} {i+1}
                      </option>
                    ))}
                  </select>
                </div>

                <button 
                  type="submit"
                  className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl transition shadow-lg text-sm mt-2"
                >
                  {dict.enterBtn}
                </button>
              </form>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen font-sans transition-colors bg-slate-100 dark:bg-slate-950 text-slate-800 dark:text-slate-100" dir={language === 'en' ? 'ltr' : 'rtl'}>
          <header className="border-b sticky top-0 z-50 backdrop-blur-md bg-white/80 dark:bg-slate-900/80 border-slate-200 dark:border-slate-800">
            <div className="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-4">
              <div>
                <h1 className="font-bold text-sm md:text-base">{user.name}</h1>
                <p className="text-xs text-emerald-600 dark:text-emerald-400 font-semibold">
                  {language === 'en' ? currentDeptData.nameEn : language === 'it' && user.department === 'تحكم صناعي' ? currentDeptData.nameIt : user.department} — ({dict.section} {user.section}) {user.isAdmin && '✨'}
                </p>
              </div>

              <div className="flex items-center gap-2 flex-wrap">
                <div className="flex items-center gap-1 bg-slate-100 dark:bg-slate-800 p-1 rounded-xl border border-slate-200 dark:border-slate-700">
                  <button onClick={() => setLanguage('ar')} className={`px-2.5 py-1 text-xs rounded-lg font-bold ${language === 'ar' ? 'bg-emerald-600 text-white' : 'text-slate-500'}`}>عربي</button>
                  <button onClick={() => setLanguage('en')} className={`px-2.5 py-1 text-xs rounded-lg font-bold ${language === 'en' ? 'bg-emerald-600 text-white' : 'text-slate-500'}`}>EN</button>
                  {user.department === 'تحكم صناعي' && (
                    <button onClick={() => setLanguage('it')} className={`px-2.5 py-1 text-xs rounded-lg font-bold ${language === 'it' ? 'bg-emerald-600 text-white' : 'text-slate-500'}`}>IT</button>
                  )}
                </div>

                <button onClick={() => setTheme(theme === 'dark' ? 'light' : 'dark')} className="p-2 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs font-bold">
                  {theme === 'dark' ? '☀️' : '🌙'}
                </button>

                <button onClick={() => setActiveTab('schedule')} className={`px-3 py-1.5 rounded-xl text-sm font-medium transition ${activeTab === 'schedule' ? 'bg-emerald-600 text-white shadow' : 'bg-slate-200 dark:bg-slate-800'}`}>
                  {dict.scheduleTab}
                </button>

                <button onClick={() => setActiveTab('chat')} className={`px-3 py-1.5 rounded-xl text-sm font-medium transition ${activeTab === 'chat' ? 'bg-emerald-600 text-white shadow' : 'bg-slate-200 dark:bg-slate-800'}`}>
                  {dict.chatTab}
                </button>

                {user.isAdmin && (
                  <button onClick={() => setActiveTab('admin')} className={`px-3 py-1.5 rounded-xl text-sm font-medium transition ${activeTab === 'admin' ? 'bg-amber-600 text-white shadow' : 'bg-amber-100 text-amber-800 dark:bg-amber-950 dark:text-amber-200'}`}>
                    {dict.adminTab}
                  </button>
                )}

                <button onClick={() => setUser(null)} className="text-xs px-3 py-1.5 rounded-xl bg-rose-100 text-rose-700 dark:bg-rose-950 dark:text-rose-300 font-semibold">
                  {dict.logout}
                </button>
              </div>
            </div>
          </header>

          <main className="max-w-7xl mx-auto px-4 py-6">
            {activeTab === 'schedule' && (
              <div className="space-y-6">
                <div className="p-4 rounded-2xl border bg-white dark:bg-slate-900 border-slate-200 dark:border-slate-800 shadow-sm flex items-center gap-3">
                  <input 
                    type="text"
                    placeholder={dict.searchPlaceholder}
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    className="w-full bg-transparent focus:outline-none text-sm"
                  />
                </div>

                <div className="p-5 rounded-2xl border bg-white dark:bg-slate-900 border-slate-200 dark:border-slate-800 flex justify-between items-center shadow-sm">
                  <div>
                    <h2 className="font-bold text-lg">
                      {dict.scheduleFor} {language === 'en' ? currentDeptData.nameEn : language === 'it' && user.department === 'تحكم صناعي' ? currentDeptData.nameIt : user.department}
                    </h2>
                    <p className="text-xs text-slate-500 dark:text-slate-400 mt-1">{dict.sec}: ({user.section})</p>
                  </div>
                  <span className="text-xs px-3 py-1.5 rounded-full font-bold bg-emerald-600 text-white shadow">
                    {dict.officiallyApproved}
                  </span>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                  {Object.entries(currentDeptData.schedule).map(([day, dayContent]) => {
                    const isDayMatch = day.toLowerCase().includes(searchQuery.toLowerCase());
                    const filteredLectures = Array.isArray(dayContent) ? dayContent.filter(item => {
                      if (!searchQuery) return true;
                      const q = searchQuery.toLowerCase();
                      return item.subject.toLowerCase().includes(q) ||
                             item.doc.toLowerCase().includes(q) ||
                             item.place.toLowerCase().includes(q) ||
                             day.toLowerCase().includes(q);
                    }) : [];

                    if (searchQuery && !isDayMatch && filteredLectures.length === 0) return null;
                    const isOffDay = dayContent === '🌴 ارتاح يابطل';

                    return (
                      <div key={day} className="rounded-2xl border p-5 shadow-sm bg-white dark:bg-slate-900 border-slate-200 dark:border-slate-800">
                        <div className="flex justify-between items-center mb-4 pb-3 border-b border-slate-100 dark:border-slate-800">
                          <h3 className="font-bold text-lg text-emerald-600 dark:text-emerald-400">{day}</h3>
                          <span className="text-xs bg-slate-100 dark:bg-slate-800 px-2.5 py-1 rounded-lg font-bold">{dict.sec} {user.section}</span>
                        </div>

                        {isOffDay ? (
                          <div className="py-10 text-center bg-slate-50 dark:bg-slate-800/40 rounded-xl border border-dashed border-slate-200 dark:border-slate-700">
                            <span className="font-bold text-emerald-600 dark:text-emerald-400 text-lg">{dict.dayOff}</span>
                          </div>
                        ) : (
                          <div className="space-y-3">
                            {filteredLectures.map((item, idx) => (
                              <div key={idx} className="p-3.5 rounded-xl border bg-slate-50 dark:bg-slate-800/50 border-slate-200 dark:border-slate-700/60 shadow-sm">
                                <div className="flex justify-between items-start mb-1.5">
                                  <span className="text-[10px] bg-emerald-600 text-white px-2 py-0.5 rounded font-bold">
                                    {item.type}
                                  </span>
                                  <span className="text-xs text-slate-500 dark:text-slate-400 font-medium">⏰ {item.time}</span>
                                </div>
                                <h4 className="font-bold text-sm mt-1">{item.subject}</h4>
                                <div className="flex justify-between text-xs text-slate-600 dark:text-slate-400 mt-2.5 pt-2 border-t border-slate-200 dark:border-slate-700">
                                  <span>👨‍🏫 {dict.doc} {item.doc}</span>
                                  <span>📍 {dict.place} {item.place}</span>
                                </div>
                              </div>
                            ))}
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {activeTab === 'chat' && (
              <div className="max-w-3xl mx-auto rounded-2xl border shadow-xl overflow-hidden flex flex-col h-[75vh] bg-white dark:bg-slate-900 border-slate-200 dark:border-slate-800">
                <div className="p-4 bg-emerald-600 text-white flex justify-between items-center shadow">
                  <div>
                    <h3 className="font-bold">{dict.chatTab}: {user.department}</h3>
                  </div>
                </div>

                <div className="flex-1 p-4 overflow-y-auto space-y-3">
                  {messages.filter(m => m.dept === user.department).map((msg) => (
                    <div key={msg.id} className={`flex flex-col ${msg.user.includes(user.name) ? 'items-end' : 'items-start'}`}>
                      <div className="flex items-center gap-2 mb-1">
                        <span className="text-xs font-bold text-slate-500 dark:text-slate-400">{msg.user}</span>
                        <span className="text-[10px] text-slate-400">{msg.time}</span>
                        {msg.isPinned && (
                          <span className="bg-amber-100 text-amber-800 text-[10px] px-2 py-0.5 rounded font-bold border border-amber-300">
                            {dict.pinnedBadge}
                          </span>
                        )}
                      </div>
                      <div className={`p-3 rounded-2xl max-w-md text-sm ${msg.user.includes(user.name) ? 'bg-emerald-600 text-white rounded-tl-none' : 'bg-slate-100 dark:bg-slate-800 text-slate-900 dark:text-slate-100 rounded-tr-none border border-slate-200 dark:border-slate-700'}`}>
                        {msg.type === 'audio' ? (
                          <audio controls src={msg.text} className="w-60 h-9"></audio>
                        ) : (
                          msg.text
                        )}
                      </div>
                    </div>
                  ))}
                </div>

                <form onSubmit={handleSendText} className="p-3 border-t flex flex-col gap-2 bg-slate-50 dark:bg-slate-950 border-slate-200 dark:border-slate-800">
                  <div className="flex items-center justify-between">
                    <div className="flex items-center gap-2">
                      <input type="checkbox" id="pinMsg" checked={isPinnedMsg} onChange={(e) => setIsPinnedMsg(e.target.checked)} className="rounded text-emerald-600" />
                      <label htmlFor="pinMsg" className="text-xs text-slate-500 dark:text-slate-400 cursor-pointer font-medium">
                        {dict.pinMessage}
                      </label>
                    </div>

                    {!isRecording ? (
                      <button type="button" onClick={startRecording} className="text-xs px-3 py-1.5 rounded-xl font-bold bg-indigo-600 text-white shadow">
                        {dict.recVoice}
                      </button>
                    ) : (
                      <button type="button" onClick={stopRecording} className="text-xs px-3 py-1.5 rounded-xl font-bold bg-rose-600 text-white shadow animate-pulse">
                        {dict.recStop}
                      </button>
                    )}
                  </div>
                  <div className="flex gap-2">
                    <input type="text" placeholder="..." value={newMessage} onChange={(e) => setNewMessage(e.target.value)} className="flex-1 px-4 py-2 border rounded-xl bg-white dark:bg-slate-900 border-slate-200 dark:border-slate-700 text-sm focus:outline-none" />
                    <button type="submit" className="bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-2 rounded-xl shadow font-bold text-sm">{dict.send}</button>
                  </div>
                </form>
              </div>
            )}

            {activeTab === 'admin' && user.isAdmin && (
              <div className="space-y-6">
                <div className="p-5 rounded-2xl border bg-amber-50 dark:bg-amber-950/30 border-amber-200 dark:border-amber-500/40">
                  <h2 className="text-lg font-bold text-amber-900 dark:text-amber-200">⚙️ لوحة تحكم الأدمن (شروق)</h2>
                </div>

                <div className="p-5 rounded-2xl border bg-white dark:bg-slate-900 border-slate-200 dark:border-slate-800 shadow-sm">
                  <h3 className="font-bold text-base mb-4 text-amber-600">📥 الرسائل المثبتة</h3>
                  <div className="space-y-3">
                    {messages.filter(m => m.isPinned).length === 0 ? (
                      <p className="text-sm text-slate-400">لا توجد رسائل مثبتة حالياً.</p>
                    ) : (
                      messages.filter(m => m.isPinned).map(m => (
                        <div key={m.id} className="p-3 border rounded-xl bg-amber-50 dark:bg-amber-950/20 border-amber-200 dark:border-amber-500/30">
                          <span className="text-xs font-bold text-amber-800 dark:text-amber-300 block mb-1">{m.user}</span>
                          <p className="text-sm">{m.text}</p>
                        </div>
                      ))
                    )}
                  </div>
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
