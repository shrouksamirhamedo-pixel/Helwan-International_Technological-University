        banPlaceholder: 'اكتب اسم الطالب المراد حظره...',
        banBtn: 'حظر الطالب',
        broadcastSection: '📢 لوحة بلاغات وتنبيهات الدكاترة للطلاب',

      },
      en: {

        lecturesHeader: '📚 Lectures (Dr):',
        sectionsHeader: '👥 Sections (Eng):',
        attendanceTitle: '📊 Student Weekly Attendance Sheet:',

        place: 'Exact Location & Room:',
        doc: 'Instructor / TA:',

        recStop: '⏹️ Stop & Send',
        pinMessage: 'Pin Message',
        pinnedBadge: '📌 Pinned',
        settingsHeader: '⚙️ Student Settings, Language, Themes & Attendance:',
        langLabel: 'Choose Platform Language:',
        themeLabel: 'Choose Theme (Light / Dark):',
        adminTitle: '⚙️ Admin Dashboard - Shrouk Samir (252)',
        banSection: '🚫 Ban & User Management',
        banPlaceholder: 'Enter student name to ban...',
        banBtn: 'Ban Student',
        broadcastSection: '📢 Doctor Notices & Announcements',
        broadcastPlaceholder: 'Write an important notice...',
        broadcastBtn: 'Publish Notice',
        bannedList: 'Banned Students:',
        broadcastList: 'Active Notices:'
      },
      it: {
        title: 'Università Tecnologica Internazionale di Helwan',
        fullName: 'Nome Completo:',
        nid: 'Carta d\'Identità (14 cifre):',
        dept: 'Dipartimento:',
        sec: 'Sezione / Gruppo:',
        enterBtn: 'Entra e Visualizza Orario 🚀',
        scheduleTab: '📅 Orario',
        chatTab: '💬 Chat',
        settingsTab: '⚙️ Impostazioni e Presenze',
        adminTab: '🔑 Admin Dashboard',
        logout: 'Esci',
        selectDay: 'Seleziona Giorno:',
        allDays: 'Tutti i Giorni',
        searchPlaceholder: '🔍 Cerca per materia, docente o aula...',
        lecturesHeader: '📚 Lezioni (Dr):',
        sectionsHeader: '👥 Sezioni (Eng):',
        attendanceTitle: '📊 Foglio Presenze Settimanali:',
        attendance: 'Stato Presenza:',
        attended: 'Presente ✓',
        notAttended: 'Assente ❌',
        dayOff: '🌴 Giorno di Riposo',
        place: 'Luogo e Aula Esatta:',
        doc: 'Docente / TA:',
        send: 'Invia',
        recVoice: '🎤 Nota Vocale',
        recStop: '⏹️ Ferma e Invia',
        pinMessage: 'Fissa per Admin',
        pinnedBadge: '📌 Fissato',
        adminTitle: '⚙️ Dashboard Admin - Shrouk Samir (252)',
        banSection: '🚫 Gestione Blocchi Utenti',
        banPlaceholder: 'Nome studente da bloccare...',
        banBtn: 'Blocca Studente',
        broadcastSection: '📢 Avvisi Docenti',
        broadcastPlaceholder: 'Scrivi un avviso...',
        broadcastBtn: 'Pubblica Avviso',
        bannedList: 'Studenti Bloccati:',
        broadcastList: 'Avvisi Attivi:'
      }
    };

    function App() {
      const [user, setUser] = useState(null);
      const [theme, setTheme] = useState('dark');
      const [language, setLanguage] = useState('ar');
      const [activeTab, setActiveTab] = useState('schedule');
      
      const [inputName, setInputName] = useState('');
      const [inputNid, setInputNid] = useState('');
      const [inputDept, setInputDept] = useState('تحكم صناعي');
      const [inputSection, setInputSection] = useState('1');

      const [selectedDayFilter, setSelectedDayFilter] = useState('all');
      const [searchQuery, setSearchQuery] = useState('');
      const [attendanceMap, setAttendanceMap] = useState({});

      const [messages, setMessages] = useState([
        { id: 1, dept: 'تحكم صناعي', user: 'شروق سمير (الأدمن)', text: 'أهلاً بكم في المنصة الرسمية لجدول الكلية.', isPinned: true, type: 'text', time: '10:00 AM' }
      ]);
      const [newMessage, setNewMessage] = useState('');
      const [isPinnedMsg, setIsPinnedMsg] = useState(false);

      const [bannedUsers, setBannedUsers] = useState([]);
      const [banInput, setBanInput] = useState('');
      const [broadcasts, setBroadcasts] = useState([
        { id: 1, text: 'تنبيه هام من إدارة الكلية والدكاترة: يرجى الالتزام التام بالمواعيد وقاعات المحاضرات والسكاشن.' }
      ]);
      const [broadcastInput, setBroadcastInput] = useState('');

      const [isRecording, setIsRecording] = useState(false);
      const mediaRecorderRef = useRef(null);
      const audioChunksRef = useRef([]);

      useEffect(() => {
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      }, [theme]);

      const dict = dictionary[language] || dictionary.ar;
      const currentDeptData = departmentsData[user ? user.department : inputDept];
      const deptTheme = currentDeptData.theme;

      const handleLogin = (e) => {
        e.preventDefault();
        if (!inputName.trim() || inputNid.length !== 14) {
          alert('برجاء إدخال الاسم الثلاثي والرقم القومي المكون من 14 رقماً بدقة!');
          return;
        }

        if (bannedUsers.includes(inputName.trim())) {
          alert('عذراً، هذا الحساب محظور من دخول المنصة.');
          return;
        }

        const isAdmin = inputName.includes('شروق') || inputNid === '252';

        setUser({
          name: isAdmin ? 'شروق سمير السيد حميدو ٢٥٢' : inputName,
          department: inputDept,
          section: inputSection,
          isAdmin
        });
      };

      const handleBanUser = (e) => {
        e.preventDefault();
        if (!banInput.trim()) return;
        setBannedUsers([...bannedUsers, banInput.trim()]);
        setBanInput('');
      };

      const handleAddBroadcast = (e) => {
        e.preventDefault();
        if (!broadcastInput.trim()) return;
        setBroadcasts([...broadcasts, { id: Date.now(), text: broadcastInput.trim() }]);
        setBroadcastInput('');
      };

      const startRecording = async () => {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          mediaRecorderRef.current = new MediaRecorder(stream);
          audioChunksRef.current = [];

          mediaRecorderRef.current.ondataavailable = (e) => {
            if (e.data.size > 0) audioChunksRef.current.push(e.data);
          };

          mediaRecorderRef.current.onstop = () => {
            const audioBlob = new Blob(audioChunksRef.current, { type: 'audio/webm' });
            const audioUrl = URL.createObjectURL(audioBlob);
            setMessages(prev => [...prev, {
              id: Date.now(),
              dept: user.department,
              user: user.name + ` (${dict.sec} ${user.section})`,
              text: audioUrl,
              isPinned: false,
              type: 'audio',
              time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            }]);
            stream.getTracks().forEach(track => track.stop());
          };

          mediaRecorderRef.current.start();
          setIsRecording(true);
        } catch (err) {
          alert('تعذر الوصول إلى الميكروفون.');
        }
      };

      const stopRecording = () => {
        if (mediaRecorderRef.current && isRecording) {
          mediaRecorderRef.current.stop();
          setIsRecording(false);
        }
      };

      const handleSendText = (e) => {
        e.preventDefault();
        if (!newMessage.trim()) return;

        setMessages(prev => [...prev, {
          id: Date.now(),
          dept: user.department,
          user: user.name + ` (${dict.sec} ${user.section})`,
          text: newMessage,
          isPinned: isPinnedMsg,
          type: 'text',
          time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        }]);

        setNewMessage('');
        setIsPinnedMsg(false);
      };

      const toggleAttendance = (lectureId) => {
        setAttendanceMap(prev => ({ ...prev, [lectureId]: !prev[lectureId] }));
      };

      if (!user) {
        return (
          <div className="min-h-screen flex items-center justify-center p-4 font-sans text-right transition-colors bg-slate-950 text-slate-100" dir={language === 'en' ? 'ltr' : 'rtl'}>
            <div className="w-full max-w-md p-8 border rounded-3xl shadow-2xl bg-white text-slate-900 border-slate-200 dark:bg-slate-900 dark:text-slate-100 dark:border-slate-800">
              
              <div className="flex justify-between items-center mb-6 pb-4 border-b border-slate-200 dark:border-slate-800">
                <div className="flex items-center gap-1 bg-slate-100 dark:bg-slate-800 p-1 rounded-xl border border-slate-200 dark:border-slate-700">
                  <button onClick={() => setLanguage('ar')} className={`px-2.5 py-1 text-xs rounded-lg font-bold transition ${language === 'ar' ? 'bg-emerald-600 text-white' : 'text-slate-500 dark:text-slate-400'}`}>عربي</button>
                  <button onClick={() => setLanguage('en')} className={`px-2.5 py-1 text-xs rounded-lg font-bold transition ${language === 'en' ? 'bg-emerald-600 text-white' : 'text-slate-500 dark:text-slate-400'}`}>EN</button>
                  <button onClick={() => setLanguage('it')} className={`px-2.5 py-1 text-xs rounded-lg font-bold transition ${language === 'it' ? 'bg-emerald-600 text-white' : 'text-slate-500 dark:text-slate-400'}`}>IT</button>
                </div>

                <button onClick={() => setTheme(theme === 'dark' ? 'light' : 'dark')} className="px-3 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs font-bold transition">
                  {theme === 'dark' ? '☀️ فاتح' : '🌙 داكن'}
                </button>
              </div>

              <div className="text-center mb-6">
                <div className="bg-emerald-600 text-white w-14 h-14 rounded-full inline-flex items-center justify-center mb-3 shadow-lg font-bold text-xl">HTU</div>
                <h1 className="text-xl font-bold">{dict.title}</h1>
                <p className="text-xs text-slate-500 mt-1">منصة الجداول الأكاديمية الذكية 2026/2027</p>
              </div>

              <form onSubmit={handleLogin} className="space-y-4">
                <div>
                  <label className="block text-xs font-semibold mb-1">{dict.fullName}</label>
                  <input 
                    type="text" 
                    required
                    placeholder="الاسم الثلاثي..."
                    value={inputName}
                    onChange={(e) => setInputName(e.target.value)}
                    className="w-full px-4 py-2.5 border rounded-xl bg-slate-50 dark:bg-slate-800 border-slate-300 dark:border-slate-700 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500"
                  />
                </div>

                <div>
                  <label className="block text-xs font-semibold mb-1">{dict.nid}</label>
                  <input 
                    type="text" 
                    required
                    maxLength="14"
                    placeholder="14 digits..."
                    value={inputNid}
                    onChange={(e) => setInputNid(e.target.value)}
                    className="w-full px-4 py-2.5 border rounded-xl bg-slate-50 dark:bg-slate-800 border-slate-300 dark:border-slate-700 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500"
                  />
                </div>

                <div>
                  <label className="block text-xs font-semibold mb-1">{dict.dept}</label>
                  <select 
                    value={inputDept}
                    onChange={(e) => {
                      setInputDept(e.target.value);
                      setInputSection('1');
                    }}
                    className="w-full px-4 py-2.5 border rounded-xl bg-slate-50 dark:bg-slate-800 border-slate-300 dark:border-slate-700 text-sm focus:outline-none"
                  >
                    {Object.keys(departmentsData).map((dept) => (
                      <option key={dept} value={dept}>{dept} {departmentsData[dept].icon}</option>
                    ))}
                  </select>
                </div>

                <div>
                  <label className="block text-xs font-semibold mb-1">{dict.sec}</label>
                  <select 
                    value={inputSection}
                    onChange={(e) => setInputSection(e.target.value)}
                    className="w-full px-4 py-2.5 border rounded-xl bg-slate-50 dark:bg-slate-800 border-slate-300 dark:border-slate-700 text-sm focus:outline-none"
                  >
                    {[...Array(currentDeptData.sectionsCount)].map((_, i) => (
                      <option key={i+1} value={i+1}>
                        {dict.sec} {i+1}
                      </option>
                    ))}
                  </select>
                </div>

                <button 
                  type="submit"
                  className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl transition shadow-lg text-sm mt-2"
                >
                  {dict.enterBtn}
                </button>
              </form>
            </div>
          </div>
        );
      }

      return (
        <div className={`min-h-screen font-sans transition-colors duration-500 ${theme === 'dark' ? deptTheme.darkBg : deptTheme.lightBg}`} dir={language === 'en' ? 'ltr' : 'rtl'}>
          <header className={`border-b sticky top-0 z-50 backdrop-blur-md ${theme === 'dark' ? 'bg-slate-900/90 border-slate-800' : 'bg-white/90 border-slate-200'}`}>
            <div className="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-4">
              <div>
                <h1 className={`font-extrabold text-base md:text-lg flex items-center gap-2 ${deptTheme.accent}`}>
                  <span>{currentDeptData.icon}</span> {user.name}
                </h1>
                <p className="text-xs font-bold opacity-90">
                  {language === 'en' ? currentDeptData.nameEn : language === 'it' && user.department === 'تحكم صناعي' ? currentDeptData.nameIt : user.department} — ({dict.sec} {user.section}) {user.isAdmin && '✨ (أدمن)'}
                </p>
              </div>

              <div className="flex items-center gap-2 flex-wrap">
                <button onClick={() => setActiveTab('schedule')} className={`px-3 py-1.5 rounded-xl text-sm font-bold transition ${activeTab === 'schedule' ? 'bg-emerald-600 text-white shadow-lg' : theme === 'dark' ? 'bg-slate-800' : 'bg-slate-200'}`}>
                  {dict.scheduleTab}
                </button>

                <button onClick={() => setActiveTab('chat')} className={`px-3 py-1.5 rounded-xl text-sm font-bold transition ${activeTab === 'chat' ? 'bg-emerald-600 text-white shadow-lg' : theme === 'dark' ? 'bg-slate-800' : 'bg-slate-200'}`}>
                  {dict.chatTab}
                </button>

                <button onClick={() => setActiveTab('settings')} className={`px-3 py-1.5 rounded-xl text-sm font-bold transition ${activeTab === 'settings' ? 'bg-indigo-600 text-white shadow-lg' : 'bg-indigo-100 text-indigo-800 dark:bg-indigo-950 dark:text-indigo-200'}`}>
                  {dict.settingsTab}
                </button>

                {user.isAdmin && (
                  <button onClick={() => setActiveTab('admin')} className={`px-3 py-1.5 rounded-xl text-sm font-bold transition ${activeTab === 'admin' ? 'bg-amber-600 text-white shadow-lg' : 'bg-amber-100 text-amber-800 dark:bg-amber-950 dark:text-amber-200'}`}>
                    {dict.adminTab}
                  </button>
                )}

                <button onClick={() => setUser(null)} className="text-xs px-3 py-1.5 rounded-xl bg-rose-100 text-rose-700 dark:bg-rose-950 dark:text-rose-300 font-bold">
                  {dict.logout}
                </button>
              </div>
            </div>
          </header>

          <main className="max-w-7xl mx-auto px-4 py-6">
            {broadcasts.length > 0 && (
              <div className="mb-6 p-4 rounded-2xl bg-amber-500/10 border border-amber-500/30 text-amber-600 dark:text-amber-300 text-xs md:text-sm font-bold flex flex-col gap-1 shadow-lg">
                <span>📢 تنبيهات الدكاترة والأقسام الرسمية:</span>
                {broadcasts.map(b => (
                  <p key={b.id} className="font-normal">• {b.text}</p>
                ))}
              </div>
            )}

            {activeTab === 'schedule' && (
              <div className="space-y-6">
                <div className={`p-5 rounded-2xl border shadow-xl backdrop-blur-md flex flex-wrap items-center justify-between gap-4 ${theme === 'dark' ? 'bg-slate-900/90 border-slate-800' : 'bg-white/90 border-slate-200'}`}>
                  <div>
                    <h2 className={`font-extrabold text-xl flex items-center gap-2 ${deptTheme.accent}`}>
                      <span>{currentDeptData.icon}</span> {language === 'en' ? currentDeptData.nameEn : user.department}
                    </h2>
                    <p className="text-xs font-bold opacity-80 mt-1">{dict.sec}: ({user.section})</p>
                  </div>

                  <div className="flex items-center gap-3 flex-wrap w-full md:w-auto">
                    <div className="relative flex-1 md:w-72">
                      <input 
                        type="text"
                        placeholder={dict.searchPlaceholder}
                        value={searchQuery}
                        onChange={(e) => setSearchQuery(e.target.value)}
                        className={`w-full px-4 py-2 border rounded-xl text-sm font-medium focus:outline-none focus:ring-2 focus:ring-emerald-500 ${theme === 'dark' ? 'bg-slate-800 border-slate-700 text-white placeholder-slate-400' : 'bg-slate-50 border-slate-300 text-slate-900 placeholder-slate-500'}`}
                      />
                      {searchQuery && (
                        <button onClick={() => setSearchQuery('')} className="absolute left-3 top-2.5 text-xs text-slate-400 font-bold">✕</button>
                      )}
                    </div>

                    <div className="flex items-center gap-2">
                      <span className="text-xs font-bold">{dict.selectDay}</span>
                      <select 
                        value={selectedDayFilter} 
                        onChange={(e) => setSelectedDayFilter(e.target.value)}
                        className={`px-4 py-2 border rounded-xl text-sm font-extrabold ${deptTheme.accent} focus:outline-none ${theme === 'dark' ? 'bg-slate-800 border-slate-700' : 'bg-slate-50 border-slate-300'}`}
                      >
                        <option value="all">{dict.allDays}</option>
                        {Object.keys(currentDeptData.schedule).map(day => (
                          <option key={day} value={day}>{day}</option>
                        ))}
                      </select>
                    </div>
                  </div>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                  {Object.entries(currentDeptData.schedule)
                    .filter(([day]) => selectedDayFilter === 'all' || day === selectedDayFilter)
                    .map(([day, dayContent]) => {
                      const isOffDay = typeof dayContent === 'string';

                      return (
                        <div key={day} className={`rounded-2xl border p-5 shadow-2xl backdrop-blur-md transition-all ${theme === 'dark' ? deptTheme.cardDark : deptTheme.cardLight}`}>
                          <div className={`flex justify-between items-center mb-4 pb-3 border-b ${theme === 'dark' ? 'border-slate-800' : 'border-slate-200'}`}>
                            <h3 className={`font-extrabold text-xl ${deptTheme.accent}`}>{day}</h3>
                            <span className={`text-xs px-3 py-1 rounded-lg font-bold ${theme === 'dark' ? 'bg-slate-800 text-slate-200' : 'bg-slate-100 text-slate-800'}`}>{dict.sec} {user.section}</span>
                          </div>

                          {isOffDay ? (
                            <div className={`py-12 text-center rounded-xl border border-dashed ${theme === 'dark' ? 'bg-slate-950/60 border-slate-800' : 'bg-slate-50 border-slate-300'}`}>
                              <span className={`font-extrabold text-lg ${deptTheme.accent}`}>{dict.dayOff}</span>
                            </div>
                          ) : (
                            <div className="space-y-6">
                              {/* المحاضرات Dr */}
                              <div>
                                <h4 className="text-xs font-black uppercase text-amber-500 mb-3 tracking-wider">{dict.lecturesHeader}</h4>
                                {dayContent.lectures && dayContent.lectures.length > 0 ? (
                                  <div className="space-y-3">
                                    {dayContent.lectures.map((item) => {
                                      const isChecked = attendanceMap[item.id] || false;
                                      return (
                                        <div key={item.id} className={`p-3.5 rounded-xl border transition shadow-sm ${isChecked ? (theme === 'dark' ? 'bg-emerald-950/40 border-emerald-500/60' : 'bg-emerald-50 border-emerald-300') : (theme === 'dark' ? 'bg-slate-950/80 border-slate-800' : 'bg-slate-50 border-slate-300')}`}>
                                          <div className="flex justify-between items-start mb-1.5">
                                            <span className="text-[10px] px-2 py-0.5 rounded font-black bg-amber-500 text-slate-950">محاضرة Dr</span>
                                            <span className="text-xs font-bold opacity-80">⏰ {item.time}</span>
                                          </div>
                                          <h5 className="font-extrabold text-xs leading-relaxed">{item.subject}</h5>
                                          <div className={`flex flex-col gap-0.5 text-[11px] font-semibold opacity-90 mt-2 pt-2 border-t ${theme === 'dark' ? 'border-slate-800' : 'border-slate-200'}`}>
                                            <span>👨‍🏫 {item.doc}</span>
                                            <span>📍 {item.place}</span>
                                          </div>
                                          <div className={`mt-2 pt-2 border-t flex justify-between items-center ${theme === 'dark' ? 'border-slate-800/80' : 'border-slate-200'}`}>
                                            <span className="text-[10px] font-bold opacity-80">{dict.attendance}</span>
                                            <button onClick={() => toggleAttendance(item.id)} className={`text-[11px] px-2.5 py-1 rounded-lg font-bold transition shadow ${isChecked ? 'bg-emerald-600 text-white' : 'bg-slate-200 text-slate-800 dark:bg-slate-800 dark:text-slate-300'}`}>
                                              {isChecked ? dict.attended : dict.notAttended}
                                            </button>
                                          </div>
                                        </div>
                                      );
                                    })}
                                  </div>
                                ) : (
                                  <p className="text-xs opacity-50 italic">لا توجد محاضرات في هذا اليوم.</p>
                                )}
                              </div>

                              {/* السكاشن Eng */}
                              <div>
                                <h4 className="text-xs font-black uppercase text-indigo-500 mb-3 tracking-wider">{dict.sectionsHeader}</h4>
                                {dayContent.sections && dayContent.sections.length > 0 ? (
                                  <div className="space-y-3">
                                    {dayContent.sections.map((item) => {
                                      const isChecked = attendanceMap[item.id] || false;
                                      return (
                                        <div key={item.id} className={`p-3.5 rounded-xl border transition shadow-sm ${isChecked ? (theme === 'dark' ? 'bg-emerald-950/40 border-emerald-500/60' : 'bg-emerald-50 border-emerald-300') : (theme === 'dark' ? 'bg-slate-950/80 border-slate-800' : 'bg-slate-50 border-slate-300')}`}>
                                          <div className="flex justify-between items-start mb-1.5">
                                            <span className="text-[10px] px-2 py-0.5 rounded font-black bg-indigo-600 text-white">سكشن Eng</span>
                                            <span className="text-xs font-bold opacity-80">⏰ {item.time}</span>
                                          </div>
                                          <h5 className="font-extrabold text-xs leading-relaxed">{item.subject}</h5>
                                          <div className={`flex flex-col gap-0.5 text-[11px] font-semibold opacity-90 mt-2 pt-2 border-t ${theme === 'dark' ? 'border-slate-800' : 'border-slate-200'}`}>
                                            <span>👨‍🏫 {item.doc}</span>
                                            <span>📍 {item.place}</span>
                                          </div>
                                          <div className={`mt-2 pt-2 border-t flex justify-between items-center ${theme === 'dark' ? 'border-slate-800/80' : 'border-slate-200'}`}>
                                            <span className="text-[10px] font-bold opacity-80">{dict.attendance}</span>
                                            <button onClick={() => toggleAttendance(item.id)} className={`text-[11px] px-2.5 py-1 rounded-lg font-bold transition shadow ${isChecked ? 'bg-emerald-600 text-white' : 'bg-slate-200 text-slate-800 dark:bg-slate-800 dark:text-slate-300'}`}>
                                              {isChecked ? dict.attended : dict.notAttended}
                                            </button>
                                          </div>
                                        </div>
                                      );
                                    })}
                                  </div>
                                ) : (
                                  <p className="text-xs opacity-50 italic">لا توجد سكاشن في هذا اليوم.</p>
                                )}
                              </div>
                            </div>
                          )}
                        </div>
                      );
                    })}
                </div>
              </div>
            )}

            {activeTab === 'settings' && (
              <div className={`max-w-2xl mx-auto rounded-2xl border shadow-2xl p-6 space-y-6 ${theme === 'dark' ? 'bg-slate-900 border-slate-800 text-slate-100' : 'bg-white border-slate-200 text-slate-900'}`}>
                <h2 className="text-xl font-extrabold pb-3 border-b border-slate-300 dark:border-slate-700">{dict.settingsHeader}</h2>
                
                <div className="space-y-2">
                  <label className="block text-sm font-bold">{dict.langLabel}</label>
                  <div className="flex items-center gap-2">
                    <button onClick={() => setLanguage('ar')} className={`px-4 py-2 text-xs rounded-xl font-extrabold transition ${language === 'ar' ? 'bg-emerald-600 text-white shadow-lg' : 'bg-slate-200 dark:bg-slate-800'}`}>العربية</button>
                    <button onClick={() => setLanguage('en')} className={`px-4 py-2 text-xs rounded-xl font-extrabold transition ${language === 'en' ? 'bg-emerald-600 text-white shadow-lg' : 'bg-slate-200 dark:bg-slate-800'}`}>English</button>
                    {user.department === 'تحكم صناعي' && (
                      <button onClick={() => setLanguage('it')} className={`px-4 py-2 text-xs rounded-xl font-extrabold transition ${language === 'it' ? 'bg-emerald-600 text-white shadow-lg' : 'bg-slate-200 dark:bg-slate-800'}`}>Italiano</button>
                    )}
                  </div>
                </div>

                <div className="space-y-2 pt-4 border-t border-slate-300 dark:border-slate-700">
                  <label className="block text-sm font-bold">{dict.themeLabel}</label>
                  <button onClick={() => setTheme(theme === 'dark' ? 'light' : 'dark')} className="px-5 py-2.5 rounded-xl bg-slate-200 dark:bg-slate-800 border border-slate-400 dark:border-slate-600 text-sm font-extrabold transition shadow">
                    {theme === 'dark' ? '☀️ التحويل إلى الوضع الفاتح' : '🌙 التحويل إلى الوضع الداكن'}
                  </button>
                </div>

                <div className="space-y-3 pt-4 border-t border-slate-300 dark:border-slate-700">
                  <h3 className="text-sm font-extrabold">{dict.attendanceTitle}</h3>
                  <div className={`p-4 rounded-xl border text-xs font-semibold space-y-2 ${theme === 'dark' ? 'bg-slate-950 border-slate-800' : 'bg-slate-50 border-slate-300'}`}>
                    <p>• إجمالي العناصر التي تم تحديدها كـ "حضر ✓": {Object.values(attendanceMap).filter(Boolean).length}</p>
                    <p className="text-emerald-500 font-bold">✓ يتم تحديث شيت الحضور والغياب فوراً وبشكل تلقائي عند تفاعلك مع الجداول.</p>
                  </div>
                </div>
              </div>
            )}

            {activeTab === 'chat' && (
              <div className={`max-w-3xl mx-auto rounded-2xl border shadow-2xl overflow-hidden flex flex-col h-[75vh] ${theme === 'dark' ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200'}`}>
                <div className={`p-4 text-white flex justify-between items-center shadow-lg ${deptTheme.badge}`}>
                  <h3 className="font-extrabold">{dict.chatTab}: {user.department} {currentDeptData.icon}</h3>
                </div>

                <div className="flex-1 p-4 overflow-y-auto space-y-3">
                  {messages.filter(m => m.dept === user.department).map((msg) => (
                    <div key={msg.id} className={`flex flex-col ${msg.user.includes(user.name) ? 'items-end' : 'items-start'}`}>
                      <div className="flex items-center gap-2 mb-1">
                        <span className="text-xs font-bold opacity-80">{msg.user}</span>
                        <span className="text-[10px] opacity-60">{msg.time}</span>
                        {msg.isPinned && (
                          <span className="bg-amber-100 text-amber-800 dark:bg-amber-950 dark:text-amber-300 text-[10px] px-2 py-0.5 rounded font-extrabold border border-amber-500/40">
                            {dict.pinnedBadge}
                          </span>
                        )}
                      </div>
                      <div className={`p-3 rounded-2xl max-w-md text-sm font-medium ${msg.user.includes(user.name) ? 'bg-emerald-600 text-white rounded-tl-none shadow-lg' : (theme === 'dark' ? 'bg-slate-800 text-slate-100 border border-slate-700' : 'bg-slate-100 text-slate-900 border border-slate-300')} rounded-tr-none`}>
                        {msg.type === 'audio' ? <audio controls src={msg.text} className="w-60 h-9"></audio> : msg.text}
                      </div>
                    </div>
                  ))}
                </div>

                <form onSubmit={handleSendText} className={`p-3 border-t flex flex-col gap-2 ${theme === 'dark' ? 'bg-slate-950 border-slate-800' : 'bg-slate-50 border-slate-300'}`}>
                  <div className="flex items-center justify-between">
                    <div className="flex items-center gap-2">
                      <input type="checkbox" id="pinMsg" checked={isPinnedMsg} onChange={(e) => setIsPinnedMsg(e.target.checked)} className="rounded text-emerald-600" />
                      <label htmlFor="pinMsg" className="text-xs font-bold opacity-80 cursor-pointer">{dict.pinMessage}</label>
                    </div>

                    {!isRecording ? (
                      <button type="button" onClick={startRecording} className="text-xs px-3 py-1.5 rounded-xl font-bold bg-indigo-600 text-white shadow hover:bg-indigo-700">{dict.recVoice}</button>
                    ) : (
                      <button type="button" onClick={stopRecording} className="text-xs px-3 py-1.5 rounded-xl font-bold bg-rose-600 text-white shadow animate-pulse">{dict.recStop}</button>
                    )}
                  </div>
                  <div className="flex gap-2">
                    <input type="text" placeholder="..." value={newMessage} onChange={(e) => setNewMessage(e.target.value)} className={`flex-1 px-4 py-2 border rounded-xl text-sm font-medium focus:outline-none ${theme === 'dark' ? 'bg-slate-900 border-slate-700 text-white' : 'bg-white border-slate-300 text-slate-900'}`} />
                    <button type="submit" className="bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-2 rounded-xl shadow-lg font-bold text-sm">{dict.send}</button>
                  </div>
                </form>
              </div>
            )}

            {activeTab === 'admin' && user.isAdmin && (
              <div className="space-y-6">
                <div className="p-5 rounded-2xl border bg-amber-500/10 border-amber-500/30 shadow">
                  <h2 className="text-lg font-extrabold text-amber-600 dark:text-amber-200">{dict.adminTitle}</h2>
                </div>

                <div className={`p-5 rounded-2xl border shadow-xl ${theme === 'dark' ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200'}`}>
                  <h3 className="font-extrabold text-base mb-3 text-rose-500">{dict.banSection}</h3>
                  <form onSubmit={handleBanUser} className="flex gap-2 mb-4">
                    <input 
                      type="text"
                      placeholder={dict.banPlaceholder}
                      value={banInput}
                      onChange={(e) => setBanInput(e.target.value)}
                      className={`flex-1 px-4 py-2 border rounded-xl text-sm font-medium focus:outline-none ${theme === 'dark' ? 'bg-slate-800 border-slate-700 text-white' : 'bg-slate-50 border-slate-300 text-slate-900'}`}
                    />
                    <button type="submit" className="bg-rose-600 hover:bg-rose-700 text-white px-4 py-2 rounded-xl text-sm font-extrabold shadow">{dict.banBtn}</button>
                  </form>
                  <div>
                    <span className="text-xs font-bold opacity-80">{dict.bannedList}</span>
                    <div className="flex flex-wrap gap-2 mt-2">
                      {bannedUsers.length === 0 ? <p className="text-xs opacity-60">لا توجد حالات حظر حالياً.</p> : bannedUsers.map((name, idx) => (
                        <span key={idx} className="bg-rose-950 text-rose-300 px-3 py-1 rounded-lg text-xs font-extrabold border border-rose-800">{name}</span>
                      ))}
                    </div>
                  </div>
                </div>

                <div className={`p-5 rounded-2xl border shadow-xl ${theme === 'dark' ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200'}`}>
                  <h3 className="font-extrabold text-base mb-3 text-amber-500">{dict.broadcastSection}</h3>
                  <form onSubmit={handleAddBroadcast} className="flex gap-2 mb-4">
                    <input 
                      type="text"
                      placeholder={dict.broadcastPlaceholder}
                      value={broadcastInput}
                      onChange={(e) => setBroadcastInput(e.target.value)}
                      className={`flex-1 px-4 py-2 border rounded-xl text-sm font-medium focus:outline-none ${theme === 'dark' ? 'bg-slate-800 border-slate-700 text-white' : 'bg-slate-50 border-slate-300 text-slate-900'}`}
                    />
                    <button type="submit" className="bg-amber-600 hover:bg-amber-700 text-white px-4 py-2 rounded-xl text-sm font-extrabold shadow">{dict.broadcastBtn}</button>
                  </form>
                  <div>
                    <span className="text-xs font-bold opacity-80">{dict.broadcastList}</span>
                    <div className="space-y-2 mt-2">
                      {broadcasts.map(b => (
                        <div key={b.id} className="p-3 rounded-xl bg-amber-950/20 border border-amber-500/40 text-xs font-bold text-amber-200">
                          {b.text}
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
