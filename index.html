        title: 'Helwan International Technological University',
        fullName: 'Full Name:',
        nid: 'National ID (14 digits):',
        dept: 'Department:',
        sec: 'Section / Group:',
        enterBtn: 'Enter Platform & View Schedule 🚀',
        scheduleTab: '📅 Schedule',
        chatTab: '💬 Department Chat',
        adminTab: '⚙️ Admin Dashboard',
        logout: 'Logout',
        selectDay: 'Select Day:',
        allDays: 'Show All Days',
        searchPlaceholder: '🔍 Search by subject, instructor, or room...',
        attendance: 'Attendance:',
        attended: 'Attended ✓',
        notAttended: 'Not Attended',
        dayOff: '🌴 Day Off',
        place: 'Location:',
        doc: 'Instructor:',
        send: 'Send',
        recVoice: '🎤 Open Voice Note',
        recStop: '⏹️ Stop & Send',
        pinMessage: 'Pin to Admin',
        pinnedBadge: '📌 Pinned',
        adminTitle: '⚙️ Admin Dashboard - Shrouk Samir (252)',
        banSection: '🚫 Ban & User Management',
        banPlaceholder: 'Enter student name to ban...',
        banBtn: 'Ban Student',
        broadcastSection: '📢 Doctor Notices & Announcements',
        broadcastPlaceholder: 'Write an important notice for students...',
        broadcastBtn: 'Publish Notice',
        bannedList: 'Banned Students:',
        broadcastList: 'Active Notices:'
      },
      it: {
        title: 'Università Tecnologica Internazionale di Helwan',
        fullName: 'Nome Completo:',
        nid: 'Carta d\'Identità (14 cifre):',
        dept: 'Dipartimento:',
        sec: 'Sezione / Gruppo:',
        enterBtn: 'Entra e Visualizza Orario 🚀',
        scheduleTab: '📅 Orario',
        chatTab: '💬 Chat',
        adminTab: '⚙️ Admin Dashboard',
        logout: 'Esci',
        selectDay: 'Seleziona Giorno:',
        allDays: 'Tutti i Giorni',
        searchPlaceholder: '🔍 Cerca per materia, docente o aula...',
        attendance: 'Presenza:',
        attended: 'Presente ✓',
        notAttended: 'Assente',
        dayOff: '🌴 Giorno di Riposo',
        place: 'Luogo:',
        doc: 'Docente:',
        send: 'Invia',
        recVoice: '🎤 Nota Vocale',
        recStop: '⏹️ Ferma e Invia',
        pinMessage: 'Fissa per Admin',
        pinnedBadge: '📌 Fissato',
        adminTitle: '⚙️ Dashboard Admin - Shrouk Samir (252)',
        banSection: '🚫 Gestione Blocchi Utenti',
        banPlaceholder: 'Nome studente da bloccare...',
        banBtn: 'Blocca Studente',
        broadcastSection: '📢 Comunicazioni e Avvisi Docenti',
        broadcastPlaceholder: 'Scrivi un avviso importante per gli studenti...',
        broadcastBtn: 'Pubblica Avviso',
        bannedList: 'Studenti Bloccati:',
        broadcastList: 'Avvisi Attivi:'
      }
    };

    function App() {
      const [user, setUser] = useState(null);
      const [theme, setTheme] = useState('dark');
      const [language, setLanguage] = useState('ar');
      const [activeTab, setActiveTab] = useState('schedule');
      
      const [inputName, setInputName] = useState('');
      const [inputNid, setInputNid] = useState('');
      const [inputDept, setInputDept] = useState('تحكم صناعي');
      const [inputSection, setInputSection] = useState('1');

      const [selectedDayFilter, setSelectedDayFilter] = useState('all');
      const [searchQuery, setSearchQuery] = useState('');
      const [attendanceMap, setAttendanceMap] = useState({});

      const [messages, setMessages] = useState([
        { id: 1, dept: 'تحكم صناعي', user: 'شروق سمير (الأدمن)', text: 'أهلاً بكم في المنصة الرسمية لجدول الكلية.', isPinned: true, type: 'text', time: '10:00 AM' }
      ]);
      const [newMessage, setNewMessage] = useState('');
      const [isPinnedMsg, setIsPinnedMsg] = useState(false);

      const [bannedUsers, setBannedUsers] = useState([]);
      const [banInput, setBanInput] = useState('');
      const [broadcasts, setBroadcasts] = useState([
        { id: 1, text: 'تنبيه هام من الدكاترة: يرجى الالتزام بمواعيد المحاضرات الرسمية.' }
      ]);
      const [broadcastInput, setBroadcastInput] = useState('');

      const [isRecording, setIsRecording] = useState(false);
      const mediaRecorderRef = useRef(null);
      const audioChunksRef = useRef([]);

      useEffect(() => {
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      }, [theme]);

      const dict = dictionary[language] || dictionary.ar;
      const currentDeptData = departmentsData[user ? user.department : inputDept];
      const deptTheme = currentDeptData.theme;

      const handleLogin = (e) => {
        e.preventDefault();
        if (!inputName.trim() || inputNid.length !== 14) {
          alert('برجاء إدخال اسم صحيح والرقم القومي المكون من 14 رقماً!');
          return;
        }

        if (bannedUsers.includes(inputName.trim())) {
          alert('عذراً، هذا الحساب محظور من دخول المنصة.');
          return;
        }

        const isAdmin = inputName.includes('شروق') || inputNid === '252';

        setUser({
          name: isAdmin ? 'شروق سمير السيد حميدو ٢٥٢' : inputName,
          department: inputDept,
          section: inputSection,
          isAdmin
        });
      };

      const handleBanUser = (e) => {
        e.preventDefault();
        if (!banInput.trim()) return;
        setBannedUsers([...bannedUsers, banInput.trim()]);
        setBanInput('');
      };

      const handleAddBroadcast = (e) => {
        e.preventDefault();
        if (!broadcastInput.trim()) return;
        setBroadcasts([...broadcasts, { id: Date.now(), text: broadcastInput.trim() }]);
        setBroadcastInput('');
      };

      const startRecording = async () => {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          mediaRecorderRef.current = new MediaRecorder(stream);
          audioChunksRef.current = [];

          mediaRecorderRef.current.ondataavailable = (e) => {
            if (e.data.size > 0) audioChunksRef.current.push(e.data);
          };

          mediaRecorderRef.current.onstop = () => {
            const audioBlob = new Blob(audioChunksRef.current, { type: 'audio/webm' });
            const audioUrl = URL.createObjectURL(audioBlob);
            setMessages(prev => [...prev, {
              id: Date.now(),
              dept: user.department,
              user: user.name + ` (${dict.sec} ${user.section})`,
              text: audioUrl,
              isPinned: false,
              type: 'audio',
              time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            }]);
            stream.getTracks().forEach(track => track.stop());
          };

          mediaRecorderRef.current.start();
          setIsRecording(true);
        } catch (err) {
          alert('تعذر الوصول إلى الميكروفون.');
        }
      };

      const stopRecording = () => {
        if (mediaRecorderRef.current && isRecording) {
          mediaRecorderRef.current.stop();
          setIsRecording(false);
        }
      };

      const handleSendText = (e) => {
        e.preventDefault();
        if (!newMessage.trim()) return;

        setMessages(prev => [...prev, {
          id: Date.now(),
          dept: user.department,
          user: user.name + ` (${dict.sec} ${user.section})`,
          text: newMessage,
          isPinned: isPinnedMsg,
          type: 'text',
          time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        }]);

        setNewMessage('');
        setIsPinnedMsg(false);
      };

      const toggleAttendance = (lectureId) => {
        setAttendanceMap(prev => ({ ...prev, [lectureId]: !prev[lectureId] }));
      };

      if (!user) {
        return (
          <div className="min-h-screen flex items-center justify-center p-4 font-sans text-right transition-colors bg-slate-950 text-slate-100 dark:bg-slate-950 dark:text-slate-100" dir={language === 'en' ? 'ltr' : 'rtl'}>
            <div className="w-full max-w-md p-8 border rounded-3xl shadow-2xl bg-white text-slate-900 border-slate-200 dark:bg-slate-900 dark:text-slate-100 dark:border-slate-800">
              
              <div className="flex justify-between items-center mb-6 pb-4 border-b border-slate-200 dark:border-slate-800">
                <div className="flex items-center gap-1 bg-slate-100 dark:bg-slate-800 p-1 rounded-xl border border-slate-200 dark:border-slate-700">
                  <button onClick={() => setLanguage('ar')} className={`px-2.5 py-1 text-xs rounded-lg font-bold transition ${language === 'ar' ? 'bg-emerald-600 text-white' : 'text-slate-500 dark:text-slate-400'}`}>عربي</button>
                  <button onClick={() => setLanguage('en')} className={`px-2.5 py-1 text-xs rounded-lg font-bold transition ${language === 'en' ? 'bg-emerald-600 text-white' : 'text-slate-500 dark:text-slate-400'}`}>EN</button>
                  <button onClick={() => setLanguage('it')} className={`px-2.5 py-1 text-xs rounded-lg font-bold transition ${language === 'it' ? 'bg-emerald-600 text-white' : 'text-slate-500 dark:text-slate-400'}`}>IT</button>
                </div>

                <button onClick={() => setTheme(theme === 'dark' ? 'light' : 'dark')} className="px-3 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs font-bold transition">
                  {theme === 'dark' ? '☀️ فاتح' : '🌙 داكن'}
                </button>
              </div>

              <div className="text-center mb-6">
                <div className="bg-emerald-600 text-white w-14 h-14 rounded-full inline-flex items-center justify-center mb-3 shadow-lg font-bold text-xl">HTU</div>
                <h1 className="text-xl font-bold">{dict.title}</h1>
              </div>

              <form onSubmit={handleLogin} className="space-y-4">
                <div>
                  <label className="block text-xs font-semibold mb-1">{dict.fullName}</label>
                  <input 
                    type="text" 
                    required
                    placeholder={dict.fullName}
                    value={inputName}
                    onChange={(e) => setInputName(e.target.value)}
                    className="w-full px-4 py-2.5 border rounded-xl bg-slate-50 dark:bg-slate-800 border-slate-300 dark:border-slate-700 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500"
                  />
                </div>

                <div>
                  <label className="block text-xs font-semibold mb-1">{dict.nid}</label>
                  <input 
                    type="text" 
                    required
                    maxLength="14"
                    placeholder="14 digits..."
                    value={inputNid}
                    onChange={(e) => setInputNid(e.target.value)}
                    className="w-full px-4 py-2.5 border rounded-xl bg-slate-50 dark:bg-slate-800 border-slate-300 dark:border-slate-700 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500"
                  />
                </div>

                <div>
                  <label className="block text-xs font-semibold mb-1">{dict.dept}</label>
                  <select 
                    value={inputDept}
                    onChange={(e) => {
                      setInputDept(e.target.value);
                      setInputSection('1');
                    }}
                    className="w-full px-4 py-2.5 border rounded-xl bg-slate-50 dark:bg-slate-800 border-slate-300 dark:border-slate-700 text-sm focus:outline-none"
                  >
                    {Object.keys(departmentsData).map((dept) => (
                      <option key={dept} value={dept}>{dept} {departmentsData[dept].icon}</option>
                    ))}
                  </select>
                </div>

                <div>
                  <label className="block text-xs font-semibold mb-1">{dict.sec}</label>
                  <select 
                    value={inputSection}
                    onChange={(e) => setInputSection(e.target.value)}
                    className="w-full px-4 py-2.5 border rounded-xl bg-slate-50 dark:bg-slate-800 border-slate-300 dark:border-slate-700 text-sm focus:outline-none"
                  >
                    {[...Array(currentDeptData.sectionsCount)].map((_, i) => (
                      <option key={i+1} value={i+1}>
                        {dict.sec} {i+1}
                      </option>
                    ))}
                  </select>
                </div>

                <button 
                  type="submit"
                  className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl transition shadow-lg text-sm mt-2"
                >
                  {dict.enterBtn}
                </button>
              </form>
            </div>
          </div>
        );
      }

      return (
        <div className={`min-h-screen font-sans transition-colors duration-500 ${theme === 'dark' ? deptTheme.darkBg : deptTheme.lightBg}`} dir={language === 'en' ? 'ltr' : 'rtl'}>
          <header className={`border-b sticky top-0 z-50 backdrop-blur-md ${theme === 'dark' ? 'bg-slate-900/90 border-slate-800' : 'bg-white/90 border-slate-200'}`}>
            <div className="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-4">
              <div>
                <h1 className={`font-bold text-sm md:text-base flex items-center gap-2 ${deptTheme.accent}`}>
                  <span>{currentDeptData.icon}</span> {user.name}
                </h1>
                <p className="text-xs font-semibold opacity-80">
                  {language === 'en' ? currentDeptData.nameEn : language === 'it' && user.department === 'تحكم صناعي' ? currentDeptData.nameIt : user.department} — ({dict.sec} {user.section}) {user.isAdmin && '✨'}
                </p>
              </div>

              <div className="flex items-center gap-2 flex-wrap">
                <div className={`flex items-center gap-1 p-1 rounded-xl border ${theme === 'dark' ? 'bg-slate-800 border-slate-700' : 'bg-slate-100 border-slate-200'}`}>
                  <button onClick={() => setLanguage('ar')} className={`px-2.5 py-1 text-xs rounded-lg font-bold ${language === 'ar' ? 'bg-emerald-600 text-white' : 'text-slate-500 dark:text-slate-400'}`}>عربي</button>
                  <button onClick={() => setLanguage('en')} className={`px-2.5 py-1 text-xs rounded-lg font-bold ${language === 'en' ? 'bg-emerald-600 text-white' : 'text-slate-500 dark:text-slate-400'}`}>EN</button>
                  {user.department === 'تحكم صناعي' && (
                    <button onClick={() => setLanguage('it')} className={`px-2.5 py-1 text-xs rounded-lg font-bold ${language === 'it' ? 'bg-emerald-600 text-white' : 'text-slate-500 dark:text-slate-400'}`}>IT</button>
                  )}
                </div>

                <button onClick={() => setTheme(theme === 'dark' ? 'light' : 'dark')} className={`p-2 rounded-xl border text-xs font-bold ${theme === 'dark' ? 'bg-slate-800 border-slate-700' : 'bg-slate-100 border-slate-200'}`}>
                  {theme === 'dark' ? '☀️' : '🌙'}
                </button>

                <button onClick={() => setActiveTab('schedule')} className={`px-3 py-1.5 rounded-xl text-sm font-medium transition ${activeTab === 'schedule' ? 'bg-emerald-600 text-white shadow' : theme === 'dark' ? 'bg-slate-800' : 'bg-slate-200'}`}>
                  {dict.scheduleTab}
                </button>

                <button onClick={() => setActiveTab('chat')} className={`px-3 py-1.5 rounded-xl text-sm font-medium transition ${activeTab === 'chat' ? 'bg-emerald-600 text-white shadow' : theme === 'dark' ? 'bg-slate-800' : 'bg-slate-200'}`}>
                  {dict.chatTab}
                </button>

                {user.isAdmin && (
                  <button onClick={() => setActiveTab('admin')} className={`px-3 py-1.5 rounded-xl text-sm font-medium transition ${activeTab === 'admin' ? 'bg-amber-600 text-white shadow' : 'bg-amber-100 text-amber-800 dark:bg-amber-950 dark:text-amber-200'}`}>
                    {dict.adminTab}
                  </button>
                )}

                <button onClick={() => setUser(null)} className="text-xs px-3 py-1.5 rounded-xl bg-rose-100 text-rose-700 dark:bg-rose-950 dark:text-rose-300 font-semibold">
                  {dict.logout}
                </button>
              </div>
            </div>
          </header>

          <main className="max-w-7xl mx-auto px-4 py-6">
            {broadcasts.length > 0 && (
              <div className="mb-6 p-4 rounded-2xl bg-amber-500/10 border border-amber-500/30 text-amber-600 dark:text-amber-300 text-xs md:text-sm font-bold flex flex-col gap-1 shadow">
                <span>📢 تنبيهات الدكاترة والأقسام:</span>
                {broadcasts.map(b => (
                  <p key={b.id} className="font-normal">• {b.text}</p>
                ))}
              </div>
            )}

            {activeTab === 'schedule' && (
              <div className="space-y-6">
                <div className={`p-5 rounded-2xl border shadow-lg backdrop-blur-md flex flex-wrap items-center justify-between gap-4 ${theme === 'dark' ? 'bg-slate-900/80 border-slate-800' : 'bg-white border-slate-200'}`}>
                  <div>
                    <h2 className={`font-bold text-lg flex items-center gap-2 ${deptTheme.accent}`}>
                      <span>{currentDeptData.icon}</span> {language === 'en' ? currentDeptData.nameEn : user.department}
                    </h2>
                    <p className="text-xs opacity-70 mt-1">{dict.sec}: ({user.section})</p>
                  </div>

                  <div className="flex items-center gap-3 flex-wrap w-full md:w-auto">
                    <div className="relative flex-1 md:w-72">
                      <input 
                        type="text"
                        placeholder={dict.searchPlaceholder}
                        value={searchQuery}
                        onChange={(e) => setSearchQuery(e.target.value)}
                        className={`w-full px-4 py-2 border rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 ${theme === 'dark' ? 'bg-slate-800 border-slate-700 text-white placeholder-slate-400' : 'bg-slate-50 border-slate-300 text-slate-900 placeholder-slate-500'}`}
                      />
                      {searchQuery && (
                        <button onClick={() => setSearchQuery('')} className="absolute left-3 top-2.5 text-xs text-slate-400">✕</button>
                      )}
                    </div>

                    <div className="flex items-center gap-2">
                      <span className="text-xs font-semibold">{dict.selectDay}</span>
                      <select 
                        value={selectedDayFilter} 
                        onChange={(e) => setSelectedDayFilter(e.target.value)}
                        className={`px-4 py-2 border rounded-xl text-sm font-bold ${deptTheme.accent} focus:outline-none ${theme === 'dark' ? 'bg-slate-800 border-slate-700' : 'bg-slate-50 border-slate-300'}`}
                      >
                        <option value="all">{dict.allDays}</option>
                        {Object.keys(currentDeptData.schedule).map(day => (
                          <option key={day} value={day}>{day}</option>
                        ))}
                      </select>
                    </div>
                  </div>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                  {Object.entries(currentDeptData.schedule)
                    .filter(([day]) => selectedDayFilter === 'all' || day === selectedDayFilter)
                    .map(([day, dayContent]) => {
                      const isOffDay = typeof dayContent === 'string';

                      const filteredLectures = !isOffDay ? dayContent.filter(item => {
                        const query = searchQuery.toLowerCase().trim();
                        if (!query) return true;
                        const subjText = typeof item.subject === 'object' ? (item.subject[language] || item.subject.ar) : item.subject;
                        return subjText.toLowerCase().includes(query) ||
                               item.doc.toLowerCase().includes(query) ||
                               item.place.toLowerCase().includes(query);
                      }) : [];

                      if (searchQuery && !isOffDay && filteredLectures.length === 0) return null;

                      return (
                        <div key={day} className={`rounded-2xl border p-5 shadow-xl backdrop-blur-md transition-all ${theme === 'dark' ? deptTheme.cardDark : deptTheme.cardLight}`}>
                          <div className={`flex justify-between items-center mb-4 pb-3 border-b ${theme === 'dark' ? 'border-slate-800' : 'border-slate-100'}`}>
                            <h3 className={`font-bold text-xl ${deptTheme.accent}`}>{day}</h3>
                            <span className={`text-xs px-2.5 py-1 rounded-lg font-bold ${theme === 'dark' ? 'bg-slate-800 text-slate-300' : 'bg-slate-100 text-slate-700'}`}>{dict.sec} {user.section}</span>
                          </div>

                          {isOffDay ? (
                            <div className={`py-12 text-center rounded-xl border border-dashed ${theme === 'dark' ? 'bg-slate-950/60 border-slate-800' : 'bg-slate-50 border-slate-200'}`}>
                              <span className={`font-bold text-lg ${deptTheme.accent}`}>{dict.dayOff}</span>
                            </div>
                          ) : (
                            <div className="space-y-4">
                              {filteredLectures.map((item) => {
                                const isChecked = attendanceMap[item.id] || false;
                                const subjectText = typeof item.subject === 'object' ? (item.subject[language] || item.subject.ar) : item.subject;
                                
                                return (
                                  <div key={item.id} className={`p-4 rounded-xl border transition shadow-sm ${isChecked ? (theme === 'dark' ? 'bg-emerald-950/30 border-emerald-500/40' : 'bg-emerald-50 border-emerald-200') : (theme === 'dark' ? 'bg-slate-950/60 border-slate-800' : 'bg-slate-50 border-slate-200')}`}>
                                    <div className="flex justify-between items-start mb-2">
                                      <span className={`text-[10px] px-2.5 py-0.5 rounded font-bold ${deptTheme.badge}`}>
                                        {item.type}
                                      </span>
                                      <span className="text-xs opacity-70 font-medium">⏰ {item.time}</span>
                                    </div>

                                    <h4 className="font-bold text-sm mt-1 leading-relaxed">{subjectText}</h4>
                                    
                                    <div className={`flex flex-col gap-1 text-xs opacity-80 mt-3 pt-2 border-t ${theme === 'dark' ? 'border-slate-800/80' : 'border-slate-200'}`}>
                                      <span>👨‍🏫 {dict.doc} {item.doc}</span>
                                      <span>📍 {dict.place} {item.place}</span>
                                    </div>

                                    <div className={`mt-3 pt-2 border-t flex justify-between items-center ${theme === 'dark' ? 'border-slate-800/50' : 'border-slate-200'}`}>
                                      <span className="text-[11px] opacity-70">{dict.attendance}</span>
                                      <button 
                                        onClick={() => toggleAttendance(item.id)}
                                        className={`text-xs px-3 py-1 rounded-lg font-bold transition ${isChecked ? 'bg-emerald-600 text-white shadow' : (theme === 'dark' ? 'bg-slate-800 text-slate-300 hover:bg-slate-700' : 'bg-slate-200 text-slate-700 hover:bg-slate-300')}`}
                                      >
                                        {isChecked ? dict.attended : dict.notAttended}
                                      </button>
                                    </div>
                                  </div>
                                );
                              })}
                            </div>
                          )}
                        </div>
                      );
                    })}
                </div>
              </div>
            )}

            {activeTab === 'chat' && (
              <div className={`max-w-3xl mx-auto rounded-2xl border shadow-2xl overflow-hidden flex flex-col h-[75vh] ${theme === 'dark' ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200'}`}>
                <div className={`p-4 text-white flex justify-between items-center shadow ${deptTheme.badge}`}>
                  <h3 className="font-bold">{dict.chatTab}: {user.department} {currentDeptData.icon}</h3>
                </div>

                <div className="flex-1 p-4 overflow-y-auto space-y-3">
                  {messages.filter(m => m.dept === user.department).map((msg) => (
                    <div key={msg.id} className={`flex flex-col ${msg.user.includes(user.name) ? 'items-end' : 'items-start'}`}>
                      <div className="flex items-center gap-2 mb-1">
                        <span className="text-xs font-bold opacity-70">{msg.user}</span>
                        <span className="text-[10px] opacity-50">{msg.time}</span>
                        {msg.isPinned && (
                          <span className="bg-amber-100 text-amber-800 dark:bg-amber-950 dark:text-amber-300 text-[10px] px-2 py-0.5 rounded font-bold border border-amber-500/30">
                            {dict.pinnedBadge}
                          </span>
                        )}
                      </div>
                      <div className={`p-3 rounded-2xl max-w-md text-sm ${msg.user.includes(user.name) ? 'bg-emerald-600 text-white rounded-tl-none' : (theme === 'dark' ? 'bg-slate-800 text-slate-100 border border-slate-700' : 'bg-slate-100 text-slate-900 border border-slate-200')} rounded-tr-none`}>
                        {msg.type === 'audio' ? <audio controls src={msg.text} className="w-60 h-9"></audio> : msg.text}
                      </div>
                    </div>
                  ))}
                </div>

                <form onSubmit={handleSendText} className={`p-3 border-t flex flex-col gap-2 ${theme === 'dark' ? 'bg-slate-950 border-slate-800' : 'bg-slate-50 border-slate-200'}`}>
                  <div className="flex items-center justify-between">
                    <div className="flex items-center gap-2">
                      <input type="checkbox" id="pinMsg" checked={isPinnedMsg} onChange={(e) => setIsPinnedMsg(e.target.checked)} className="rounded text-emerald-600" />
                      <label htmlFor="pinMsg" className="text-xs opacity-70 cursor-pointer font-medium">{dict.pinMessage}</label>
                    </div>

                    {!isRecording ? (
                      <button type="button" onClick={startRecording} className="text-xs px-3 py-1.5 rounded-xl font-bold bg-indigo-600 text-white shadow hover:bg-indigo-700">{dict.recVoice}</button>
                    ) : (
                      <button type="button" onClick={stopRecording} className="text-xs px-3 py-1.5 rounded-xl font-bold bg-rose-600 text-white shadow animate-pulse">{dict.recStop}</button>
                    )}
                  </div>
                  <div className="flex gap-2">
                    <input type="text" placeholder="..." value={newMessage} onChange={(e) => setNewMessage(e.target.value)} className={`flex-1 px-4 py-2 border rounded-xl text-sm focus:outline-none ${theme === 'dark' ? 'bg-slate-900 border-slate-700 text-white' : 'bg-white border-slate-300 text-slate-900'}`} />
                    <button type="submit" className="bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-2 rounded-xl shadow font-bold text-sm">{dict.send}</button>
                  </div>
                </form>
              </div>
            )}

            {activeTab === 'admin' && user.isAdmin && (
              <div className="space-y-6">
                <div className="p-5 rounded-2xl border bg-amber-500/10 border-amber-500/30">
                  <h2 className="text-lg font-bold text-amber-600 dark:text-amber-200">{dict.adminTitle}</h2>
                </div>

                <div className={`p-5 rounded-2xl border shadow-sm ${theme === 'dark' ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200'}`}>
                  <h3 className="font-bold text-base mb-3 text-rose-500">{dict.banSection}</h3>
                  <form onSubmit={handleBanUser} className="flex gap-2 mb-4">
                    <input 
                      type="text"
                      placeholder={dict.banPlaceholder}
                      value={banInput}
                      onChange={(e) => setBanInput(e.target.value)}
                      className={`flex-1 px-4 py-2 border rounded-xl text-sm focus:outline-none ${theme === 'dark' ? 'bg-slate-800 border-slate-700 text-white' : 'bg-slate-50 border-slate-300 text-slate-900'}`}
                    />
                    <button type="submit" className="bg-rose-600 hover:bg-rose-700 text-white px-4 py-2 rounded-xl text-sm font-bold shadow">{dict.banBtn}</button>
                  </form>
                  <div>
                    <span className="text-xs font-semibold opacity-70">{dict.bannedList}</span>
                    <div className="flex flex-wrap gap-2 mt-2">
                      {bannedUsers.length === 0 ? <p className="text-xs opacity-50">لا توجد حالات حظر حالياً.</p> : bannedUsers.map((name, idx) => (
                        <span key={idx} className="bg-rose-950 text-rose-300 px-3 py-1 rounded-lg text-xs font-bold border border-rose-800">{name}</span>
                      ))}
                    </div>
                  </div>
                </div>

                <div className={`p-5 rounded-2xl border shadow-sm ${theme === 'dark' ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200'}`}>
                  <h3 className="font-bold text-base mb-3 text-amber-500">{dict.broadcastSection}</h3>
                  <form onSubmit={handleAddBroadcast} className="flex gap-2 mb-4">
                    <input 
                      type="text"
                      placeholder={dict.broadcastPlaceholder}
                      value={broadcastInput}
                      onChange={(e) => setBroadcastInput(e.target.value)}
                      className={`flex-1 px-4 py-2 border rounded-xl text-sm focus:outline-none ${theme === 'dark' ? 'bg-slate-800 border-slate-700 text-white' : 'bg-slate-50 border-slate-300 text-slate-900'}`}
                    />
                    <button type="submit" className="bg-amber-600 hover:bg-amber-700 text-white px-4 py-2 rounded-xl text-sm font-bold shadow">{dict.broadcastBtn}</button>
                  </form>
                  <div>
                    <span className="text-xs font-semibold opacity-70">{dict.broadcastList}</span>
                    <div className="space-y-2 mt-2">
                      {broadcasts.map(b => (
                        <div key={b.id} className="p-3 rounded-xl bg-amber-950/20 border border-amber-500/30 text-xs text-amber-200">
                          {b.text}
                        </div>
                      ))}
                    </div>
                  </div>
                </div>

                <div className={`p-5 rounded-2xl border shadow-sm ${theme === 'dark' ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200'}`}>
                  <h3 className="font-bold text-base mb-4 text-amber-500">📥 الرسائل المثبتة من الطلاب</h3>
                  <div className="space-y-3">
                    {messages.filter(m => m.isPinned).length === 0 ? (
                      <p className="text-sm opacity-50">لا توجد رسائل مثبتة حالياً.</p>
                    ) : (
                      messages.filter(m => m.isPinned).map(m => (
                        <div key={m.id} className="p-3 border rounded-xl bg-amber-950/20 border-amber-500/30">
                          <span className="text-xs font-bold text-amber-300 block mb-1">{m.user}</span>
                          <p className="text-sm text-slate-200">{m.text}</p>
                        </div>
                      ))
                    )}
                  </div>
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
